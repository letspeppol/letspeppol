services:
  proxy:
    build:
      context: ../../proxy
      dockerfile: Dockerfile
    image: lp-proxy:latest
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE must be set}
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${PROXY_USER:?PROXY_USER must be set}
      DB_PASS: ${PROXY_PASS:?PROXY_PASS must be set}
      KYC_JWKS_URI: http://kyc:8084/auth/oauth2/jwks
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-letspeppol-api}
      KYC_ISSUER_URI: ${ISSUER_URI:?Set ISSUER_URI to the public KYC issuer URL, including /kyc}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      SCHEDULER_SEND_DELAY: ${SCHEDULER_SEND_DELAY:-1000}
      SCHEDULER_SEND_SLOWDOWN: ${SCHEDULER_SEND_SLOWDOWN:-16}
      SCHEDULER_SYNC_DELAY: ${SCHEDULER_SYNC_DELAY:-60000}
      SCHEDULER_SYNC_LIMIT: ${SCHEDULER_SYNC_LIMIT:-60}
      SCHEDULER_RECEIVE_DELAY: ${SCHEDULER_RECEIVE_DELAY:-300000}
      E_INVOICE_API_URL: ${E_INVOICE_API_URL:-https://api-dev.e-invoice.be/api}
      E_INVOICE_ORGANISATION_API_URL: ${E_INVOICE_ORGANISATION_API_URL:-https://api.e-invoice.be/api/admin}
      E_INVOICE_ORGANISATION_API_KEY: ${E_INVOICE_ORGANISATION_API_KEY:?E_INVOICE_ORGANISATION_API_KEY must be set}
      SCRADA_API_URL: ${SCRADA_API_URL:-https://apitest.scrada.be}
      SCRADA_API_KEY: ${SCRADA_API_KEY:?SCRADA_API_KEY must be set}
      SCRADA_API_PWD: ${SCRADA_API_PWD:?SCRADA_API_PWD must be set}
      SCRADA_COMPANY_ID: ${SCRADA_COMPANY_ID:?SCRADA_COMPANY_ID must be set}
      SCRADA_COMPANY_KEY: ${SCRADA_COMPANY_KEY:?SCRADA_COMPANY_KEY must be set}
      BACKUP_DATA_DIR: /opt/data/proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $$DB_HOST -p $$DB_PORT -U $$DB_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - /mnt/data/proxy:/opt/data/proxy
    networks:
      - web
      - default
      - observability

  app:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    image: lp-app:latest
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE must be set}
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${APP_USER:?APP_USER must be set}
      DB_PASS: ${APP_PASS:?APP_PASS must be set}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST must be set}
      MAIL_PORT: ${MAIL_PORT:?MAIL_PORT must be set}
      MAIL_USER: ${MAIL_USER:?MAIL_USER must be set}
      MAIL_PASS: ${MAIL_PASS:?MAIL_PASS must be set}
      MAIL_FROM: ${MAIL_NOTIFICATION_FROM:?MAIL_NOTIFICATION_FROM must be set}
      KYC_JWKS_URI: http://kyc:8084/auth/oauth2/jwks
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-letspeppol-api}
      KYC_ISSUER_URI: ${ISSUER_URI:?Set ISSUER_URI to the public KYC issuer URL, including /kyc}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET:?SERVICE_CLIENT_SECRET must be set}
      KYC_TOKEN_URI: http://kyc:8084/auth/oauth2/token
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      KYC_API_URL: ${KYC_API_URL:-http://kyc:8084}
      KYC_AUTH_APP_EXTERNAL_ID: ${KYC_AUTH_APP_EXTERNAL_ID:-b095630d-1bf3-4250-bf9e-2d49e6ce505b}
      PROXY_API_URL: ${PROXY_API_URL:-http://proxy:8086}
      PROXY_SYNC_DELAY: ${PROXY_SYNC_DELAY:-60000}
      PEPPOL_DIR_URL: ${PEPPOL_DIR_URL:-https://test-directory.peppol.eu}
      OPEN_COLLECTIVE_URL: ${OPEN_COLLECTIVE_URL:-https://api.opencollective.com/graphql/v2/}
      OPEN_COLLECTIVE_API_KEY: ${OPEN_COLLECTIVE_API_KEY:?OPEN_COLLECTIVE_API_KEY must be set}
      DOCUMENT_PRICE: ${DOCUMENT_PRICE:?DOCUMENT_PRICE must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $$DB_HOST -p $$DB_PORT -U $$DB_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - /mnt/data/app:/opt/data/app
    networks:
      - web
      - default

  kyc:
    build:
      context: ../../kyc
      dockerfile: Dockerfile
    image: lp-kyc:latest
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE must be set}
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${KYC_USER:?KYC_USER must be set}
      DB_PASS: ${KYC_PASS:?KYC_PASS must be set}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST must be set}
      MAIL_PORT: ${MAIL_PORT:?MAIL_PORT must be set}
      MAIL_USER: ${MAIL_USER:?MAIL_USER must be set}
      MAIL_PASS: ${MAIL_PASS:?MAIL_PASS must be set}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
      UI_URL: ${UI_BLUE_URL:?UI_BLUE_URL must be set}
      ISSUER_URI: ${ISSUER_URI:?Set ISSUER_URI to the public KYC issuer URL, including /kyc}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:?OAUTH2_REDIRECT_URI must be set}
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-letspeppol-api}
      # RSA signing keys provided as a mounted secret (see volumes) — never baked into the image.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-file:/run/secrets/kyc-private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-file:/run/secrets/kyc-public.pem}
      KYC_AUTH_APP_EXTERNAL_ID: ${KYC_AUTH_APP_EXTERNAL_ID:-b095630d-1bf3-4250-bf9e-2d49e6ce505b}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET:?SERVICE_CLIENT_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      ENCRYPTION_KEY_1: ${ENCRYPTION_KEY_1:?ENCRYPTION_KEY_1 must be set}
      PROXY_API_URL: ${PROXY_API_URL:-http://proxy:8086}
      KBO_LOOKUP_BASE_URL: ${KBO_LOOKUP_BASE_URL:-https://kbopub.economie.fgov.be/kbopub-m/enterprise}
      KBO_SFTP_HOST: ${KBO_SFTP_HOST:-ftps.economie.fgov.be}
      KBO_SFTP_PORT: ${KBO_SFTP_PORT:-22}
      KBO_SFTP_USERNAME: ${KBO_SFTP_USERNAME:?KBO_SFTP_USERNAME must be set}
      KBO_SFTP_PASSWORD: ${KBO_SFTP_PASSWORD:?KBO_SFTP_PASSWORD must be set}
      KBO_SFTP_BASE_DIR: ${KBO_SFTP_BASE_DIR:-/}
      KBO_SFTP_FULL_DIR: ${KBO_SFTP_FULL_DIR:-full}
      KBO_SFTP_DELTA_DIR: ${KBO_SFTP_DELTA_DIR:-delta}
      KBO_SFTP_DELTA_CRON: ${KBO_SFTP_DELTA_CRON:-0 30 2 * * *}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?WEBAUTHN_RP_ID must be set}
      WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:?WEBAUTHN_RP_ORIGINS must be set}
      CONTRACT_DATA_DIR: /opt/data/kyc
      WEBEID_TRUSTED_CA_TRUSTSTORE: /kyc/truststore/belgian-eid.jks
      WEBEID_TRUSTED_CA_TRUSTSTORE_PASSWORD: changeit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $$DB_HOST -p $$DB_PORT -U $$DB_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - /mnt/data/kyc:/opt/data/kyc
      # RSA signing keys mounted read-only; provision them on the host out of band.
      - ${KYC_KEYS_DIR:-/opt/keys/kyc}:/run/secrets:ro
    networks:
      - web
      - default

  ui:
    build:
      context: ../../app/ui
      dockerfile: Dockerfile
    image: lp-ui:latest
    depends_on:
      - app
    environment:
      NODE_ENV: production
    expose:
      - "80"
    networks:
      - web
      - default
    labels:
      - "traefik.enable=true"

      # API rate limit middleware
      - "traefik.http.middlewares.api-limit.ratelimit.average=20"
      - "traefik.http.middlewares.api-limit.ratelimit.burst=75"
      - "traefik.http.middlewares.api-limit.ratelimit.period=1s"
      - "traefik.http.middlewares.api-limit.ratelimit.sourceCriterion.ipStrategy.depth=1"

      # Public router
      - "traefik.http.routers.blue.rule=Host(`${ACTIVE_DOMAIN_BLUE:?ACTIVE_DOMAIN_BLUE must be set}`)"
      - "traefik.http.routers.blue.entrypoints=websecure"
      - "traefik.http.routers.blue.service=nginx"
      - "traefik.http.routers.blue.tls.certresolver=${CERT_RESOLVER_BLUE:?CERT_RESOLVER_BLUE must be set}"

      # API router
      - "traefik.http.routers.blue-api.rule=Host(`${ACTIVE_DOMAIN_BLUE:?ACTIVE_DOMAIN_BLUE must be set}`) && (PathPrefix(`/proxy/api/`) || PathPrefix(`/app/api/`) || PathPrefix(`/kyc/api/`))"
      - "traefik.http.routers.blue-api.entryPoints=websecure"
      - "traefik.http.routers.blue-api.middlewares=api-limit"
      - "traefik.http.routers.blue-api.service=nginx"
      - "traefik.http.routers.blue-api.tls.certresolver=${CERT_RESOLVER_BLUE:?CERT_RESOLVER_BLUE must be set}"

      # Browser authentication router. Spring owns staged session authentication and CSRF.
      - "traefik.http.routers.blue-auth-browser.rule=Host(`${ACTIVE_DOMAIN_BLUE:?ACTIVE_DOMAIN_BLUE must be set}`) && PathPrefix(`/kyc/auth/browser/`)"
      - "traefik.http.routers.blue-auth-browser.entryPoints=websecure"
      - "traefik.http.routers.blue-auth-browser.middlewares=api-limit"
      - "traefik.http.routers.blue-auth-browser.service=nginx"
      - "traefik.http.routers.blue-auth-browser.tls.certresolver=${CERT_RESOLVER_BLUE:?CERT_RESOLVER_BLUE must be set}"

      # OAuth2 protocol router. Do not require a blanket JWT/forward-auth middleware here:
      # Spring Authorization Server applies session, PKCE, or client auth per endpoint.
      - "traefik.http.routers.blue-auth-oauth2.rule=Host(`${ACTIVE_DOMAIN_BLUE:?ACTIVE_DOMAIN_BLUE must be set}`) && PathPrefix(`/kyc/auth/oauth2/`)"
      - "traefik.http.routers.blue-auth-oauth2.entryPoints=websecure"
      - "traefik.http.routers.blue-auth-oauth2.middlewares=api-limit"
      - "traefik.http.routers.blue-auth-oauth2.service=nginx"
      - "traefik.http.routers.blue-auth-oauth2.tls.certresolver=${CERT_RESOLVER_BLUE:?CERT_RESOLVER_BLUE must be set}"

      # OIDC bearer endpoints are kept separate so policy can be tightened independently.
      - "traefik.http.routers.blue-auth-oidc.rule=Host(`${ACTIVE_DOMAIN_BLUE:?ACTIVE_DOMAIN_BLUE must be set}`) && PathPrefix(`/kyc/auth/oidc/`)"
      - "traefik.http.routers.blue-auth-oidc.entryPoints=websecure"
      - "traefik.http.routers.blue-auth-oidc.middlewares=api-limit"
      - "traefik.http.routers.blue-auth-oidc.service=nginx"
      - "traefik.http.routers.blue-auth-oidc.tls.certresolver=${CERT_RESOLVER_BLUE:?CERT_RESOLVER_BLUE must be set}"

      # Discovery stays at its issuer-derived well-known location and must remain public.
      - "traefik.http.routers.blue-auth-discovery.rule=Host(`${ACTIVE_DOMAIN_BLUE:?ACTIVE_DOMAIN_BLUE must be set}`) && PathPrefix(`/kyc/.well-known/`)"
      - "traefik.http.routers.blue-auth-discovery.entryPoints=websecure"
      - "traefik.http.routers.blue-auth-discovery.middlewares=api-limit"
      - "traefik.http.routers.blue-auth-discovery.service=nginx"
      - "traefik.http.routers.blue-auth-discovery.tls.certresolver=${CERT_RESOLVER_BLUE:?CERT_RESOLVER_BLUE must be set}"

      # Protected API router
      # JWT is validated by the services themselves (JWKS from the KYC auth server),
      # so no traefik jwt middleware here.
      - "traefik.http.routers.blue-sapi.rule=Host(`${ACTIVE_DOMAIN_BLUE:?ACTIVE_DOMAIN_BLUE must be set}`) && (PathPrefix(`/proxy/sapi/`) || PathPrefix(`/app/sapi/`) || PathPrefix(`/kyc/sapi/`))"
      - "traefik.http.routers.blue-sapi.entryPoints=websecure"
      - "traefik.http.routers.blue-sapi.middlewares=api-limit"
      - "traefik.http.routers.blue-sapi.service=nginx"
      - "traefik.http.routers.blue-sapi.tls.certresolver=${CERT_RESOLVER_BLUE:?CERT_RESOLVER_BLUE must be set}"

      # Local API router
      - "traefik.http.routers.blue-lapi.rule=Host(`localhost`) && (PathPrefix(`/proxy/lapi/`) || PathPrefix(`/app/lapi/`) || PathPrefix(`/kyc/lapi/`))"
      - "traefik.http.routers.blue-lapi.entrypoints=internal"
      - "traefik.http.routers.blue-lapi.middlewares=api-limit"
      - "traefik.http.routers.blue-lapi.service=nginx"

      # Service definition
      - "traefik.http.services.nginx.loadbalancer.server.port=80"

networks:
  web:
    external: true
  observability:
    external: true
    name: observability
