x-backend: &backend
  depends_on:
    db:
      condition: service_healthy

x-backend-environment: &backend-environment
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
  DB_HOST: db
  DB_PORT: 5432
  OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-letspeppol-api}
  SERVICE_CLIENT_SECRET:
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${UI_PORT:-3001}}
  UI_URL: ${UI_URL:-http://localhost:${UI_PORT:-3001}}
  MAIL_HOST: ${MAIL_HOST:-mail}
  MAIL_PORT: ${MAIL_PORT:-1025}
  MAIL_USER: ${MAIL_USER:-}
  MAIL_PASS: ${MAIL_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-noreply@letspeppol.localhost}
  MAIL_SMTP_AUTH:
  MAIL_SMTP_SSL:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      APP_USER: ${APP_USER:-app}
      APP_PASS: ${APP_PASS:-app}
      KYC_USER: ${KYC_USER:-kyc}
      KYC_PASS: ${KYC_PASS:-kyc}
      PROXY_USER: ${PROXY_USER:-proxy}
      PROXY_PASS: ${PROXY_PASS:-proxy}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  mail:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"

  adminer:
    image: adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"

  proxy:
    <<: *backend
    build:
      context: ../../proxy
      dockerfile: Dockerfile
    image: lp-proxy:latest
    environment:
      <<: *backend-environment
      DB_USER: ${PROXY_USER:-proxy}
      DB_PASS: ${PROXY_PASS:-proxy}
      KYC_JWKS_URI: http://kyc:8084/auth/oauth2/jwks
      KYC_ISSUER_URI: ${ISSUER_URI:-http://localhost:${UI_PORT:-3001}/kyc}
      SCHEDULER_SEND_DELAY: ${SCHEDULER_SEND_DELAY:-1000}
      SCHEDULER_SEND_SLOWDOWN: ${SCHEDULER_SEND_SLOWDOWN:-16}
      SCHEDULER_SYNC_DELAY: ${SCHEDULER_SYNC_DELAY:-60000}
      SCHEDULER_SYNC_LIMIT: ${SCHEDULER_SYNC_LIMIT:-60}
      SCHEDULER_RECEIVE_DELAY: ${SCHEDULER_RECEIVE_DELAY:-300000}
      E_INVOICE_API_URL: ${E_INVOICE_API_URL:-https://api-dev.e-invoice.be/api}
      E_INVOICE_ORGANISATION_API_URL: ${E_INVOICE_ORGANISATION_API_URL:-https://api.e-invoice.be/api/admin}
      E_INVOICE_ORGANISATION_API_KEY: ${E_INVOICE_ORGANISATION_API_KEY:-}
      SCRADA_API_URL: ${SCRADA_API_URL:-https://apitest.scrada.be}
      SCRADA_API_KEY: ${SCRADA_API_KEY:-}
      SCRADA_API_PWD: ${SCRADA_API_PWD:-}
      SCRADA_COMPANY_ID: ${SCRADA_COMPANY_ID:-}
      SCRADA_COMPANY_KEY: ${SCRADA_COMPANY_KEY:-}
      PEPPOL_ACCESS_POINT: ${PEPPOL_ACCESS_POINT:-SCRADA}
      RECOMMAND_API_URL: ${RECOMMAND_API_URL:-https://app.recommand.eu}
      RECOMMAND_API_KEY: ${RECOMMAND_API_KEY:-}
      RECOMMAND_API_SECRET: ${RECOMMAND_API_SECRET:-}
      BACKUP_DATA_DIR: /opt/data/proxy
    volumes:
      - ./opt/data/proxy:/opt/data/proxy

  app:
    <<: *backend
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    image: lp-app:latest
    environment:
      <<: *backend-environment
      DB_USER: ${APP_USER:-app}
      DB_PASS: ${APP_PASS:-app}
      KYC_JWKS_URI: http://kyc:8084/auth/oauth2/jwks
      KYC_ISSUER_URI: ${ISSUER_URI:-http://localhost:${UI_PORT:-3001}/kyc}
      KYC_TOKEN_URI: http://kyc:8084/auth/oauth2/token
      KYC_API_URL: ${KYC_API_URL:-http://kyc:8084}
      KYC_AUTH_APP_EXTERNAL_ID: ${KYC_AUTH_APP_EXTERNAL_ID:-b095630d-1bf3-4250-bf9e-2d49e6ce505b}
      PROXY_API_URL: ${PROXY_API_URL:-http://proxy:8086}
      PROXY_SYNC_DELAY: ${PROXY_SYNC_DELAY:-60000}
      PEPPOL_DIR_URL: ${PEPPOL_DIR_URL:-https://test-directory.peppol.eu}
      OPEN_COLLECTIVE_URL: ${OPEN_COLLECTIVE_URL:-https://api.opencollective.com/graphql/v2/}
      OPEN_COLLECTIVE_API_KEY: ${OPEN_COLLECTIVE_API_KEY:-}
      DOCUMENT_PRICE:
      DOWNLOAD_ARCHIVE_DIR: ${DOWNLOAD_ARCHIVE_DIR:-/tmp/letspeppol-downloads}
    volumes:
      - ./opt/data/app:/opt/data/app

  kyc:
    <<: *backend
    build:
      context: ../../kyc
      dockerfile: Dockerfile
    image: lp-kyc:latest
    environment:
      <<: *backend-environment
      DB_USER: ${KYC_USER:-kyc}
      DB_PASS: ${KYC_PASS:-kyc}
      ISSUER_URI: ${ISSUER_URI:-http://localhost:${UI_PORT:-3001}/kyc}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost:${UI_PORT:-3001}/callback}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-classpath:kyc-private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-classpath:kyc-public.pem}
      KYC_AUTH_APP_EXTERNAL_ID: ${KYC_AUTH_APP_EXTERNAL_ID:-b095630d-1bf3-4250-bf9e-2d49e6ce505b}
      KYC_TOKEN_URI: ${KYC_TOKEN_URI:-http://kyc:8084/auth/oauth2/token}
      ENCRYPTION_KEY_1:
      PROXY_API_URL: ${PROXY_API_URL:-http://proxy:8086}
      KBO_LOOKUP_BASE_URL: ${KBO_LOOKUP_BASE_URL:-https://kbopub.economie.fgov.be/kbopub-m/enterprise}
      KBO_SFTP_HOST: ${KBO_SFTP_HOST:-ftps.economie.fgov.be}
      KBO_SFTP_PORT: ${KBO_SFTP_PORT:-22}
      KBO_SFTP_USERNAME: ${KBO_SFTP_USERNAME:-}
      KBO_SFTP_PASSWORD: ${KBO_SFTP_PASSWORD:-}
      KBO_SFTP_BASE_DIR: ${KBO_SFTP_BASE_DIR:-/}
      KBO_SFTP_FULL_DIR: ${KBO_SFTP_FULL_DIR:-full}
      KBO_SFTP_DELTA_DIR: ${KBO_SFTP_DELTA_DIR:-delta}
      KBO_SFTP_DELTA_CRON: ${KBO_SFTP_DELTA_CRON:-0 30 2 * * *}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:-http://localhost:${UI_PORT:-3001}}
      CONTRACT_DATA_DIR: /opt/data/kyc
      WEBEID_TRUSTED_CA_TRUSTSTORE: /kyc/truststore/belgian-eid.jks
      WEBEID_TRUSTED_CA_TRUSTSTORE_PASSWORD: changeit
    volumes:
      - ./opt/data/kyc:/opt/data/kyc

  ui:
    build:
      context: ../../app/ui
      dockerfile: Dockerfile
    image: lp-ui:latest
    depends_on:
      - app
      - kyc
      - proxy
    ports:
      - "${UI_PORT:-3001}:80"

volumes:
  db-data:
