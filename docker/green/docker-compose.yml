services:
  proxy:
    build:
      context: ../../proxy
      dockerfile: Dockerfile
    image: lp-proxy:latest
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${PROXY_USER}
      DB_PASS: ${PROXY_PASS}
      KYC_JWKS_URI: http://kyc:8084/auth/oauth2/jwks
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-letspeppol-api}
      KYC_ISSUER_URI: ${ISSUER_URI}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SCHEDULER_SEND_DELAY: ${SCHEDULER_SEND_DELAY}
      SCHEDULER_SEND_SLOWDOWN: ${SCHEDULER_SEND_SLOWDOWN}
      SCHEDULER_SYNC_DELAY: ${SCHEDULER_SYNC_DELAY}
      SCHEDULER_SYNC_LIMIT: ${SCHEDULER_SYNC_LIMIT}
      SCHEDULER_RECEIVE_DELAY: ${SCHEDULER_RECEIVE_DELAY}
      E_INVOICE_API_URL: ${E_INVOICE_API_URL}
      E_INVOICE_ORGANISATION_API_URL: ${E_INVOICE_ORGANISATION_API_URL}
      E_INVOICE_ORGANISATION_API_KEY: ${E_INVOICE_ORGANISATION_API_KEY}
      SCRADA_API_URL: ${SCRADA_API_URL}
      SCRADA_API_KEY: ${SCRADA_API_KEY}
      SCRADA_API_PWD: ${SCRADA_API_PWD}
      SCRADA_COMPANY_ID: ${SCRADA_COMPANY_ID}
      SCRADA_COMPANY_KEY: ${SCRADA_COMPANY_KEY}
      BACKUP_DATA_DIR: /opt/data/proxy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - /mnt/data/proxy:/opt/data/proxy
    networks:
      - web
      - default
      - observability

  app:
    build:
      context: ../../app/backend
      dockerfile: Dockerfile
    image: lp-app:latest
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${APP_USER}
      DB_PASS: ${APP_PASS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_NOTIFICATION_FROM}
      KYC_JWKS_URI: http://kyc:8084/auth/oauth2/jwks
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-letspeppol-api}
      KYC_ISSUER_URI: ${ISSUER_URI}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      KYC_TOKEN_URI: http://kyc:8084/auth/oauth2/token
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KYC_API_URL: ${KYC_API_URL}
      KYC_AUTH_APP_EXTERNAL_ID: ${KYC_AUTH_APP_EXTERNAL_ID}
      PROXY_API_URL: ${PROXY_API_URL}
      PROXY_SYNC_DELAY: ${PROXY_SYNC_DELAY}
      PEPPOL_DIR_URL: ${PEPPOL_DIR_URL}
      OPEN_COLLECTIVE_URL: ${OPEN_COLLECTIVE_URL}
      OPEN_COLLECTIVE_API_KEY: ${OPEN_COLLECTIVE_API_KEY}
      DOCUMENT_PRICE: ${DOCUMENT_PRICE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - /mnt/data/app:/opt/data/app
    networks:
      - web
      - default

  kyc:
    build:
      context: ../../kyc
      dockerfile: Dockerfile
    image: lp-kyc:latest
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${KYC_USER}
      DB_PASS: ${KYC_PASS}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      UI_URL: ${UI_GREEN_URL}
      ISSUER_URI: ${ISSUER_URI}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI}
      OAUTH2_AUDIENCE: ${OAUTH2_AUDIENCE:-letspeppol-api}
      # RSA signing keys provided as a mounted secret (see volumes) — never baked into the image.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-file:/run/secrets/kyc-private.pem}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-file:/run/secrets/kyc-public.pem}
      KYC_AUTH_APP_EXTERNAL_ID: ${KYC_AUTH_APP_EXTERNAL_ID}
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ENCRYPTION_KEY_1: ${ENCRYPTION_KEY_1}
      PROXY_API_URL: ${PROXY_API_URL}
      KBO_LOOKUP_BASE_URL: ${KBO_LOOKUP_BASE_URL}
      KBO_SFTP_HOST: ${KBO_SFTP_HOST}
      KBO_SFTP_PORT: ${KBO_SFTP_PORT}
      KBO_SFTP_USERNAME: ${KBO_SFTP_USERNAME}
      KBO_SFTP_PASSWORD: ${KBO_SFTP_PASSWORD}
      KBO_SFTP_BASE_DIR: ${KBO_SFTP_BASE_DIR}
      KBO_SFTP_FULL_DIR: ${KBO_SFTP_FULL_DIR}
      KBO_SFTP_DELTA_DIR: ${KBO_SFTP_DELTA_DIR}
      KBO_SFTP_DELTA_CRON: ${KBO_SFTP_DELTA_CRON}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS}
      CONTRACT_DATA_DIR: /opt/data/kyc
      WEBEID_TRUSTED_CA_TRUSTSTORE: /kyc/truststore/belgian-eid.jks
      WEBEID_TRUSTED_CA_TRUSTSTORE_PASSWORD: changeit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - /mnt/data/kyc:/opt/data/kyc
      # RSA signing keys mounted read-only; provision them on the host out of band.
      - ${KYC_KEYS_DIR:-/opt/keys/kyc}:/run/secrets:ro
    networks:
      - web
      - default

  ui:
    build:
      context: ../../app/ui
      dockerfile: Dockerfile
    image: lp-ui:latest
    depends_on:
      - app
    environment:
      NODE_ENV: production
    expose:
      - "80"
    labels:
      - "traefik.enable=true"

      # API rate limit middleware
      - "traefik.http.middlewares.api-limit.ratelimit.average=20"
      - "traefik.http.middlewares.api-limit.ratelimit.burst=75"
      - "traefik.http.middlewares.api-limit.ratelimit.period=1s"
      - "traefik.http.middlewares.api-limit.ratelimit.sourceCriterion.ipStrategy.depth=1"

      # Public router
      - "traefik.http.routers.green.rule=Host(`${ACTIVE_DOMAIN_GREEN}`)"
      - "traefik.http.routers.green.entrypoints=websecure"
      - "traefik.http.routers.green.service=nginx"
      - "traefik.http.routers.green.tls.certresolver=${CERT_RESOLVER_GREEN}"

      # API router
      - "traefik.http.routers.green-api.rule=Host(`${ACTIVE_DOMAIN_GREEN}`) && (PathPrefix(`/proxy/api/`) || PathPrefix(`/app/api/`) || PathPrefix(`/kyc/api/`))"
      - "traefik.http.routers.green-api.entryPoints=websecure"
      - "traefik.http.routers.green-api.middlewares=api-limit"
      - "traefik.http.routers.green-api.service=nginx"
      - "traefik.http.routers.green-api.tls.certresolver=${CERT_RESOLVER_GREEN}"

      # Browser authentication router. Spring owns staged session authentication and CSRF.
      - "traefik.http.routers.green-auth-browser.rule=Host(`${ACTIVE_DOMAIN_GREEN}`) && PathPrefix(`/kyc/auth/browser/`)"
      - "traefik.http.routers.green-auth-browser.entryPoints=websecure"
      - "traefik.http.routers.green-auth-browser.middlewares=api-limit"
      - "traefik.http.routers.green-auth-browser.service=nginx"
      - "traefik.http.routers.green-auth-browser.tls.certresolver=${CERT_RESOLVER_GREEN}"

      # OAuth2 protocol router. Do not require a blanket JWT/forward-auth middleware here:
      # Spring Authorization Server applies session, PKCE, or client auth per endpoint.
      - "traefik.http.routers.green-auth-oauth2.rule=Host(`${ACTIVE_DOMAIN_GREEN}`) && PathPrefix(`/kyc/auth/oauth2/`)"
      - "traefik.http.routers.green-auth-oauth2.entryPoints=websecure"
      - "traefik.http.routers.green-auth-oauth2.middlewares=api-limit"
      - "traefik.http.routers.green-auth-oauth2.service=nginx"
      - "traefik.http.routers.green-auth-oauth2.tls.certresolver=${CERT_RESOLVER_GREEN}"

      # OIDC bearer endpoints are kept separate so policy can be tightened independently.
      - "traefik.http.routers.green-auth-oidc.rule=Host(`${ACTIVE_DOMAIN_GREEN}`) && PathPrefix(`/kyc/auth/oidc/`)"
      - "traefik.http.routers.green-auth-oidc.entryPoints=websecure"
      - "traefik.http.routers.green-auth-oidc.middlewares=api-limit"
      - "traefik.http.routers.green-auth-oidc.service=nginx"
      - "traefik.http.routers.green-auth-oidc.tls.certresolver=${CERT_RESOLVER_GREEN}"

      # Discovery stays at its issuer-derived well-known location and must remain public.
      - "traefik.http.routers.green-auth-discovery.rule=Host(`${ACTIVE_DOMAIN_GREEN}`) && PathPrefix(`/kyc/.well-known/`)"
      - "traefik.http.routers.green-auth-discovery.entryPoints=websecure"
      - "traefik.http.routers.green-auth-discovery.middlewares=api-limit"
      - "traefik.http.routers.green-auth-discovery.service=nginx"
      - "traefik.http.routers.green-auth-discovery.tls.certresolver=${CERT_RESOLVER_GREEN}"

      # Protected API router
      - "traefik.http.routers.green-sapi.rule=Host(`${ACTIVE_DOMAIN_GREEN}`) && (PathPrefix(`/proxy/sapi/`) || PathPrefix(`/app/sapi/`) || PathPrefix(`/kyc/sapi/`))"
      - "traefik.http.routers.green-sapi.entryPoints=websecure"
      - "traefik.http.routers.green-sapi.middlewares=api-limit"
      - "traefik.http.routers.green-sapi.service=nginx"
      - "traefik.http.routers.green-sapi.tls.certresolver=${CERT_RESOLVER_GREEN}"

      # Local API router
      - "traefik.http.routers.green-lapi.rule=Host(`localhost`) && (PathPrefix(`/proxy/lapi/`) || PathPrefix(`/app/lapi/`) || PathPrefix(`/kyc/lapi/`))"
      - "traefik.http.routers.green-lapi.entrypoints=internal"
      - "traefik.http.routers.green-lapi.middlewares=api-limit"
      - "traefik.http.routers.green-lapi.service=nginx"

      # Service definition
      - "traefik.http.services.nginx.loadbalancer.server.port=80"

networks:
  web:
    external: true
  observability:
    external: true
    name: observability
