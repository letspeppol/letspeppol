services:

  minio:
    image: minio/minio
    command: "minio server --address ':9000' --console-address ':9001' /data"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      MINIO_DEFAULT_BUCKETS: mimir
    volumes:
      - minio_data:/data
    networks:
      - observability

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/mimir myminio/mimir-blocks myminio/mimir-alertmanager myminio/mimir-ruler;
      /usr/bin/mc mb --ignore-existing myminio/loki-data myminio/loki-ruler;
      #/usr/bin/mc policy set public mimir mimir-blocks mimir-alertmanager mimir-ruler loki-data loki-ruler;
      exit 0;
      "
    networks:
      - observability

  mimir:
    image: grafana/mimir:latest
    command: ["-config.file=/etc/mimir.yaml", "-config.expand-env=true"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    hostname: mimir
    depends_on:
      - minio
    volumes:
      - ./mimir/config.yml:/etc/mimir.yaml
      - mimir_data:/data
    networks:
      - observability

  alloy:
    image: grafana/alloy:latest
    environment:
      SERVER_NAME: ${SERVER_NAME}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
    command: [ "run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345" ]
    depends_on:
      - loki
      - mimir
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml
      - loki_data:/loki
    command: ["-config.file=/etc/loki/config.yml", "-config.expand-env=true"]
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:?GRAFANA_PASS must be set in .env}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}:8443/
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - loki
      - mimir
    networks:
      - observability
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=internal"
      - "traefik.http.routers.grafana.tls.certresolver=${CERT_RESOLVER}"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  node_exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    networks:
      - observability
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    networks:
      - observability
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--docker_only=true"

networks:
  observability:
    name: observability
    driver: bridge
    internal: true
  web:
    external: true
    name: web

volumes:
  minio_data:
  mimir_data:
  grafana_data:
  loki_data:
  
