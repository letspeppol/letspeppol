# PostgreSQL DataSource configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/kyc
spring.datasource.username=${DB_USER:kyc}
spring.datasource.password=${DB_PASS:kyc}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
# Spring Authorization Server uses JdbcOperations directly (not Hibernate), so set the JDBC
# connection schema as well as Hibernate/Flyway's schema. Otherwise it queries public.oauth2_*
# while Flyway created kyc.oauth2_* and the first authorization request fails with HTTP 500.
spring.datasource.hikari.schema=kyc
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=kyc
spring.flyway.default-schema=kyc
spring.flyway.schemas=kyc
spring.flyway.enabled=true
