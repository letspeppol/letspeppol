# Local development normally has no usable SMTP credentials. Do not make KYC report DOWN (or wait
# for an SMTP connection) just because the optional mail health contributor cannot authenticate.
management.health.mail.enabled=false
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:true}
