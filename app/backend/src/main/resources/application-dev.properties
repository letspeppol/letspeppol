# Local development normally has no usable SMTP credentials. Do not make the app report DOWN (or
# wait for an SMTP connection) just because the optional mail health contributor cannot authenticate.
management.health.mail.enabled=false
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:true}

download.archive-directory=${DOWNLOAD_ARCHIVE_DIR:${java.io.tmpdir}/letspeppol-downloads}