
upstream proxy_backend {
    zone proxy_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server proxy:8086 resolve;
}

upstream app_backend {
    zone app_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server app:8085 resolve;
}

upstream kyc_backend {
    zone kyc_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server kyc:8084 resolve;
}

server {
    listen 80;
    listen [::]:80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # External origins are allowlisted per resource type. Keep this list explicit.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://letspeppol.org; connect-src 'self' https://test-directory.peppol.eu; font-src 'self'; frame-src 'self' https://letspeppol.org https://youtube.com https://www.youtube.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/(?!kyc/|app/|proxy/).*\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /proxy/ {
        proxy_pass http://proxy_backend/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /app/actuator {
        return 404;
    }

    location ^~ /app/actuator/ {
        return 404;
    }

    location /app/ {
        proxy_pass http://app_backend/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kyc/ {
        proxy_pass http://kyc_backend/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /kyc;
    }
}
