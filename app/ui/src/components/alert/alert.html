<div class="toast-region" aria-live="polite">
    <div repeat.for="toast of toasts"
         class="toast is-${toast.alertType.toLowerCase()}"
         role.bind="isUrgent(toast) ? 'alert' : null"
         mouseenter.trigger="pause(toast)"
         mouseleave.trigger="resume(toast)"
         focusin.trigger="pause(toast)"
         focusout.trigger="resume(toast)">
        <span class="toast-icon">
            <template switch.bind="toast.alertType">
                <svg case="Success" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                <svg case="Info" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                <svg case="Warning" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                <svg case="Danger" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
                <svg case="Neutral" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </template>
        </span>
        <div class="toast-body">
            <p class="toast-title">
                <template switch.bind="toast.alertType">
                    <span case="Success" t="alert.success">Success</span>
                    <span case="Info" t="alert.info">Info</span>
                    <span case="Warning" t="alert.warning">Warning</span>
                    <span case="Danger" t="alert.danger">Error</span>
                    <span case="Neutral" t="alert.neutral">Message</span>
                </template>
            </p>
            <p class="toast-message">${toast.text}</p>
        </div>
        <button type="button" class="toast-close" t="[aria-label]common.close;[title]common.close" click.trigger="dismiss(toast)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
    </div>
</div>
