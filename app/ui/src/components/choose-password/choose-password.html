<import from="./choose-password.css"></import>

<template>
    <div class="choose-password">
        <h2 if.bind="showHeading" t="confirmation.choose-credentials-title">Choose a password</h2>
        <label class="field">
            <span t="label.password">Password</span>
            <input name="password" type="password" autocomplete="new-password" value.two-way="password" />
        </label>
        <label class="field">
            <span t="label.confirm-password">Confirm password</span>
            <input name="confirm-password" type="password" autocomplete="new-password" value.two-way="confirmPassword" />
        </label>
        <template if.bind="password">
            <meter min="0" max="8" low="4" high="7" optimum="8" value.bind="rules.pwScore" t="[aria-label]password-rules.strength" aria-label="Password strength"></meter>
            <ul class="pw-hints">
                <li ok.class="rules.lengthOk" t="password-rules.length">At least 12 characters</li>
                <li ok.class="rules.lowerOk" t="password-rules.lower">At least 1 lowercase letter</li>
                <li ok.class="rules.upperOk" t="password-rules.upper">At least 1 uppercase letter</li>
                <li ok.class="rules.numberOk" t="password-rules.number">At least 1 number</li>
                <li ok.class="rules.symbolOk" t="password-rules.symbol">At least 1 symbol</li>
                <li ok.class="rules.matchOk" t="password-rules.match">Passwords match</li>
            </ul>
        </template>
    </div>
</template>
