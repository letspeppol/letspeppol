<import from="../lang/language-selector"></import>
<import from="../theme/theme-selector"></import>
<import from="./nav-icon"></import>

<header class="app-header" ref="headerEl" data-layout="full">
    <div class="band on-navy" ref="bandEl">
        <a class="band-brand" load="route.bind: homePath; context.bind: null" t="[aria-label]navigation.brand-alt">
            <svg class="band-mark" viewBox="0 0 320 320" aria-hidden="true" focusable="false">
                <g transform="translate(32,32)" fill="none" stroke-width="16">
                    <circle cx="128" cy="128" r="128" stroke="currentColor"/>
                    <path d="M0 128h256M128 0v256M17 64h222M17 192h222" stroke="currentColor"/>
                    <path d="m128,0 a32,64 0 0,0 0,256 a32,64 0 0,0 0,-256" stroke="currentColor"/>
                    <polyline class="band-mark-halo" points="120,120 160,160 264,64" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="120,120 160,160 264,64" stroke="#faa21d" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </svg>
            <span class="band-wordmark" t="navigation.brand-alt">Let’s Peppol</span>
        </a>

        <nav class="band-nav" t="[aria-label]navigation.main">
            <a repeat.for="item of navItems"
               class="band-link"
               is-secondary.class="!item.inBar"
               load="route.bind: item.path; context.bind: null"
               aria-current.bind="item.id === activeSection ? 'page' : null"
               click.trigger="onNavigate(item)"
               new-feature-section.bind="item.feature">
                <nav-icon name.bind="item.id"></nav-icon>
                <span t.bind="item.labelKey"></span>
            </a>
        </nav>

        <div class="band-spacer"></div>

        <label if.bind="ownerships.length > 1" class="company-switcher" title.bind="'navigation.switch-company' & t">
            <nav-icon name="switch-company"></nav-icon>
            <span class="company-name">${currentCompanyName}</span>
            <nav-icon name="chevron"></nav-icon>
            <select class="company-select"
                    value.bind="selectedOwnershipKey"
                    change.trigger="changeOwnership()"
                    disabled.bind="swapping"
                    aria-label.bind="'navigation.switch-company' & t">
                <option repeat.for="ownership of ownerships" value.bind="getOwnershipKey(ownership)">${getOwnershipLabel(ownership)}</option>
            </select>
        </label>
        <div if.bind="ownerships.length === 1" class="company-switcher is-static">
            <span class="company-name">${currentCompanyName}</span>
        </div>

        <div class="band-tools">
            <button type="button"
                    class="band-button"
                    click.trigger="goToAddOwnership()"
                    title.bind="'ownershipAdd.tooltip' & t"
                    aria-label.bind="'ownershipAdd.action' & t"
                    new-feature="add-account">
                <nav-icon name="add-company"></nav-icon>
                <span if.bind="ownerships.length <= 1" t="ownershipAdd.action">Add company</span>
            </button>
            <theme-selector></theme-selector>
            <language-selector></language-selector>
            <button type="button" class="band-button" t="[title]common.logout;[aria-label]common.logout" click.trigger="logout()">
                <nav-icon name="log-out"></nav-icon>
            </button>
        </div>

        <button type="button"
                class="band-button account-button"
                aria-haspopup="dialog"
                aria-expanded.bind="menuOpen ? 'true' : 'false'"
                t="[aria-label]navigation.account-menu;[title]navigation.account-menu"
                click.trigger="toggleMenu($event)">
            <nav-icon name="user"></nav-icon>
            <nav-icon name="chevron"></nav-icon>
        </button>
        <button type="button"
                class="band-button menu-button"
                aria-haspopup="dialog"
                aria-expanded.bind="menuOpen ? 'true' : 'false'"
                aria-label.bind="(menuOpen ? 'navigation.close-menu' : 'navigation.menu') & t"
                click.trigger="toggleMenu($event)">
            <nav-icon name.bind="menuOpen ? 'close' : 'menu'"></nav-icon>
        </button>
    </div>
</header>

<nav class="bottom-bar" t="[aria-label]navigation.bottom-bar">
    <a repeat.for="item of barItems"
       class="bar-item"
       load="route.bind: item.path; context.bind: null"
       aria-current.bind="item.id === activeSection ? 'page' : null"
       click.trigger="onNavigate(item)"
       new-feature-section.bind="item.feature">
        <nav-icon name.bind="item.id"></nav-icon>
        <span class="bar-label" t.bind="item.labelKey"></span>
    </a>
    <button type="button"
            class="bar-item"
            aria-haspopup="dialog"
            aria-expanded.bind="menuOpen ? 'true' : 'false'"
            click.trigger="toggleMenu($event)">
        <nav-icon name="more"></nav-icon>
        <span class="bar-label" t="navigation.more">More</span>
    </button>
</nav>

<div if.bind="menuOpen"
     class="modal app-menu menu-${menuKind}"
     role="dialog"
     aria-modal="true"
     aria-labelledby="app-menu-title"
     keydown.trigger="onMenuKeydown($event)">
    <div class="modal-backdrop" click.trigger="closeMenu()"></div>
    <div class="modal-card app-menu-card" ref="menuCard" tabindex="-1">
        <header class="modal-header app-menu-header">
            <h2 id="app-menu-title" t="navigation.menu">Menu</h2>
            <button type="button" class="icon-btn app-menu-close" t="[aria-label]navigation.close-menu" click.trigger="closeMenu()">
                <nav-icon name="close"></nav-icon>
            </button>
        </header>
        <div class="modal-body app-menu-body">
            <ul if.bind="menuItems.length" class="menu-list">
                <li repeat.for="item of menuItems">
                    <a class="menu-row"
                       load="route.bind: item.path; context.bind: null"
                       aria-current.bind="item.id === activeSection ? 'page' : null"
                       click.trigger="onNavigate(item)"
                       new-feature-section.bind="item.feature">
                        <nav-icon name.bind="item.id"></nav-icon>
                        <span class="menu-label" t.bind="item.labelKey"></span>
                    </a>
                </li>
            </ul>
            <ul class="menu-list">
                <li>
                    <button type="button" class="menu-row" click.trigger="goToAddOwnership()">
                        <nav-icon name="add-company"></nav-icon>
                        <span class="menu-label" t="ownershipAdd.action">Add company</span>
                    </button>
                </li>
                <li>
                    <button type="button"
                            class="menu-row"
                            role="switch"
                            aria-checked.bind="theme.themeDark ? 'true' : 'false'"
                            click.trigger="theme.switchTheme()">
                        <nav-icon name.bind="theme.themeDark ? 'moon' : 'sun'"></nav-icon>
                        <span class="menu-label" t="navigation.dark-mode">Dark mode</span>
                        <span class="menu-switch" aria-hidden="true"></span>
                    </button>
                </li>
                <li>
                    <label class="menu-row">
                        <nav-icon name="language"></nav-icon>
                        <span class="menu-label" t="navigation.language">Language</span>
                        <language-selector></language-selector>
                    </label>
                </li>
                <li>
                    <button type="button" class="menu-row" click.trigger="logout()">
                        <nav-icon name="log-out"></nav-icon>
                        <span class="menu-label" t="common.logout">Log out</span>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</div>
