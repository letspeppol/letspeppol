<select class="lang-select"
        value.bind="currentLocale"
        change.trigger="changeLocale($event.target.value)"
        t="[aria-label]navigation.language;[title]navigation.language">
    <option value="nl">NL</option>
    <option value="fr">FR</option>
    <option value="en">EN</option>
    <option value="de">DE</option>
</select>
