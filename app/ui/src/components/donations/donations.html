<import from="./sponsor-payment-modal"></import>

<sponsor-payment-modal component.ref="sponsorPaymentModal"></sponsor-payment-modal>

<aside if.bind="accountInfo" class="donation-bar" new-feature="donation-bar" t="[aria-label]donations.bar-label">
    <svg class="donation-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19.414 14.414C21 12.828 22 11.5 22 9.5a5.5 5.5 0 0 0-9.591-3.676.6.6 0 0 1-.818.001A5.5 5.5 0 0 0 2 9.5c0 2.3 1.5 4 3 5.5l5.535 5.362a2 2 0 0 0 2.879.052 2.12 2.12 0 0 0-.004-3 2.124 2.124 0 1 0 3-3 2.124 2.124 0 0 0 3.004 0 2 2 0 0 0 0-2.828l-1.881-1.882a2.41 2.41 0 0 0-3.409 0l-1.71 1.71a2 2 0 0 1-2.828 0 2 2 0 0 1 0-2.828l2.823-2.762"/></svg>

    <div class="donation-stats">
        <p class="donation-stat-line">
            <span class="num">${accountInfo.activeCompanies}</span>
            <span t="[title]donations.active-companies-title;donations.active-companies">companies</span>,
            <span class="num">${accountInfo.totalProcessed}</span>
            <span t="[title]donations.invoices-processed-title;donations.invoices-processed">invoices</span>
        </p>
        <p class="donation-stat-line donation-stat-secondary">
            <span class="num">${sponsors.length}</span>
            <span t="[title]donations.sponsors-title;donations.sponsors">tier sponsors</span>,
            <span class="num">${totalSponsorTransactions}</span>
            <span t="[title]donations.donations-received-title;donations.donations-received">donations</span>
        </p>
    </div>

    <a if.bind="activeSponsor" class="donation-sponsor" href.bind="activeSponsor.url" target="_blank" rel="noopener noreferrer">
        <img class="donation-sponsor-logo" src.bind="activeSponsor.logoUrl" alt.bind="activeSponsor.name">
    </a>

    <button type="button" class="donation-recent" click.trigger="showSponsors()">
        <ul if.bind="recentTransactions.length" class="donation-recent-list">
            <li repeat.for="transaction of recentTransactions">
                <span class="donation-recent-name">${transaction.name}</span>
                <span class="donation-recent-amount num">+${transaction.amount} ${transaction.currency}</span>
            </li>
        </ul>
        <span class="donation-recent-more" t="donations.view-sponsors">View all sponsors</span>
    </button>

    <div class="donation-actions">
        <button if.bind="ownershipService.admin" type="button" class="btn small" click.trigger="showSponsorPaymentModal()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 14h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 16"/><path d="m7 20 1.6-1.4c.4-.4.9-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.8-2.8l-4.2 3.9"/><path d="m2 15 6 6"/><path d="M19.5 8.5c.7-.7 1.5-1.6 1.5-3A3.5 3.5 0 0 0 17.5 2c-1.1 0-2.1.5-2.8 1.2A3.8 3.8 0 0 0 12 2a3.5 3.5 0 0 0-3.5 3.5c0 1.4.8 2.3 1.5 3l4.7 4.7Z"/></svg>
            <span t="donations.donate">Donate</span>
        </button>
        <a class="btn small"
           href="https://www.linkedin.com/company/letspeppol/"
           target="_blank"
           rel="noopener noreferrer"
           t="[aria-label]donations.follow-linkedin;[title]donations.follow-linkedin">
            <svg class="donation-linkedin" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect width="24" height="24" rx="3" fill="#0a66c2"/>
                <path fill="#fff" d="M5.34 9.16h3.12v9.49H5.34V9.16Zm1.57-4.7c1 0 1.81.81 1.81 1.81S7.91 8.08 6.91 8.08s-1.81-.81-1.81-1.81.81-1.81 1.81-1.81Zm3.41 4.7h2.99v1.3h.04c.42-.79 1.43-1.62 2.95-1.62 3.15 0 3.73 2.07 3.73 4.76v5.05h-3.12v-4.48c0-1.07-.02-2.44-1.49-2.44-1.49 0-1.72 1.16-1.72 2.36v4.56h-3.12V9.16h-.26Z"/>
            </svg>
            <span t="donations.follow">Follow</span>
        </a>
    </div>
</aside>
