<import from="../components/view/wizard-view"></import>

<wizard-view>
    <h1 au-slot="header" t="forgot.title">Reset your password</h1>
    <div if.bind="requestSent" class="auth-form">
        <p role="status" t="forgot.info-sent">If an account uses this email address, a reset link is on its way.</p>
        <p class="auth-alt"><a href="../login" t="login.back">Back to sign in</a></p>
    </div>
    <form else class="auth-form" submit.trigger="forgotPassword()">
        <p class="wizard-lead" t="forgot.enter-email">Enter your email address and we’ll send you a link to choose a new password.</p>
        <label class="field">
            <span t="label.email">Email</span>
            <input name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus value.bind="email" t="[placeholder]placeholder.email"/>
        </label>
        <p if.bind="error" class="form-error" role="alert" t="forgot.request-failed">The reset link couldn’t be sent.</p>
        <div class="auth-actions">
            <button type="submit" class="btn primary" disabled.bind="sending" t="forgot.request-link">Send reset link</button>
        </div>
        <p class="auth-alt"><a href="../login" t="login.back">Back to sign in</a></p>
    </form>
</wizard-view>
