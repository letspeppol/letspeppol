<import from="../components/view/wizard-view"></import>

<wizard-view>
    <h1 au-slot="header" t.bind="step === 'totp' ? 'login.verification-title' : 'login.title'">Sign in</h1>

    <div if.bind="loadingSession" class="login-status" role="status">
        <span class="spinner login-spinner" aria-hidden="true"></span>
        <span t="login.checking-session">Checking your session...</span>
    </div>

    <template else>
    <div if.bind="serviceUnavailable" class="login-status" role="status">
        <p t="login.unavailable">The sign-in service is still starting or currently unavailable.</p>
        <div class="auth-actions">
            <button type="button" class="btn primary" click.trigger="retrySession()" t="login.retry">Try again</button>
        </div>
    </div>

    <template else>
    <form if.bind="step === 'credentials'" class="auth-form login-form" submit.trigger="submitCredentials()">
        <label class="field">
            <span t="label.email">Email</span>
            <input name="username"
                   type="email"
                   inputmode="email"
                   autocomplete="username webauthn"
                   autocapitalize="none"
                   spellcheck="false"
                   required
                   autofocus
                   value.bind="email"
                   t="[placeholder]placeholder.email" />
        </label>
        <div class="field">
            <span class="login-field-heading">
                <label for="login-password" t="label.password">Password</label>
                <a href="../forgot-password" t="login.forgot">Forgot your password?</a>
            </span>
            <input id="login-password"
                   name="password"
                   type="password"
                   autocomplete="current-password"
                   required
                   value.bind="password" />
        </div>
        <label class="field checkbox">
            <input name="rememberEmail" type="checkbox" checked.bind="rememberEmail" />
            <span t="login.remember">Remember my email</span>
        </label>

        <p if.bind="errorKey" class="form-error" role="alert" t.bind="errorKey">The email address or password is incorrect.</p>

        <div class="auth-actions">
            <button type="submit" class="btn primary login-submit" disabled.bind="busy">
                <span t.bind="busy ? 'login.signing-in' : 'login.continue'">Sign in</span>
            </button>
        </div>

        <template if.bind="passkeyAvailable">
            <div class="login-divider"><span t="login.or">or</span></div>
            <button type="button" class="btn login-passkey" disabled.bind="busy" click.trigger="signInWithPasskey()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>
                <span t="login.passkey">Sign in with a passkey</span>
            </button>
        </template>

        <p class="auth-alt login-register">
            <span t="login.new">New here?</span>
            <a href="../registration" t="login.register">Register your company</a>
        </p>
    </form>

    <form else class="auth-form login-form" submit.trigger="submitVerificationCode()">
        <p if.bind="!useRecoveryCode" class="wizard-lead" t="login.verification-instructions">Enter the 6-digit code from your authenticator app.</p>
        <p else class="wizard-lead" t="login.recovery-instructions">Enter one of your recovery codes.</p>

        <label class="field">
            <span t.bind="useRecoveryCode ? 'login.recovery-code' : 'login.verification-code'">Authentication code</span>
            <input if.bind="!useRecoveryCode"
                   class="login-code"
                   name="verificationCode"
                   type="text"
                   inputmode="numeric"
                   pattern="[0-9]*"
                   maxlength="6"
                   autocomplete="one-time-code"
                   required
                   autofocus
                   value.bind="verificationCode"
                   input.trigger="onVerificationCodeInput($event)" />
            <input else
                   class="login-code"
                   name="recoveryCode"
                   type="text"
                   maxlength="8"
                   autocapitalize="characters"
                   spellcheck="false"
                   autocomplete="one-time-code"
                   required
                   autofocus
                   value.bind="verificationCode"
                   input.trigger="onRecoveryCodeInput($event)" />
        </label>

        <p if.bind="errorKey" class="form-error" role="alert" t.bind="errorKey">That code didn’t work.</p>

        <div class="auth-actions">
            <button type="submit" class="btn primary login-submit" disabled.bind="busy">
                <span t.bind="busy ? 'login.verifying' : 'login.verify'">Verify</span>
            </button>
        </div>

        <button type="button" class="auth-link" click.trigger="toggleRecoveryCode($event)" t.bind="useRecoveryCode ? 'login.use-authenticator' : 'login.use-recovery'">Use a recovery code instead</button>
    </form>
    </template>
    </template>
</wizard-view>
