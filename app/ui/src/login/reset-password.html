<import from="../components/view/wizard-view"></import>
<import from="../components/choose-password/choose-password"></import>

<wizard-view>
    <h1 au-slot="header" t="reset.title">Choose a new password</h1>
    <form class="auth-form" submit.trigger="resetPassword()">
        <p class="wizard-lead" t="reset.intro">Choose a new password for your Let’s Peppol account.</p>
        <choose-password component.ref="choosePassword" password.two-way="password" confirm-password.two-way="confirmPassword"></choose-password>
        <div if.bind="error" class="form-error" role="alert">
            <span>
                <span t="reset.reset-failed">Your password couldn’t be changed. The link may have expired or already been used.</span>
                <a href="../forgot-password" t="reset.request-new">Request a new link</a>
            </span>
        </div>
        <div class="auth-actions">
            <button type="submit" class="btn primary" disabled.bind="saving || !password || !choosePassword || !choosePassword.rules.matchOk || !choosePassword.rules.pwStrong" t="reset.action">Save new password</button>
        </div>
        <p class="auth-alt"><a href="../login" t="login.back">Back to sign in</a></p>
    </form>
</wizard-view>
