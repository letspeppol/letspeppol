<import from="../components/view/application-view"></import>
<import from="../components/confirmation/confirmation-modal"></import>
<import from="./settings-tabs"></import>

<confirmation-modal></confirmation-modal>

<application-view>
    <settings-tabs active="company"></settings-tabs>
    <div class="section-header">
        <h1 t="settings.company.title">Company</h1>
        <div class="actions">
            <button type="button" class="btn" load="route.bind: addCompanyPath; context.bind: null" title="Add company" t="[title]ownershipAdd.tooltip">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span t="ownershipAdd.action">Add company</span>
            </button>
            <template if.bind="ownershipService.granted.COMPANY_SETTINGS">
                <button type="button" class="btn" click.trigger="cancelChanges()" disabled.bind="accountSaving" t="account.cancel">Cancel</button>
                <button class="btn primary" click.trigger="saveAccount()" disabled.bind="accountSaving">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-save-icon lucide-save"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>
                    <span t="account.save">Save</span>
                </button>
            </template>
        </div>
    </div>
    <section>
        <div style="display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
            <div class="card">
                <div class="card-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-building-icon lucide-building"><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M12 6h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/><path d="M8 6h.01"/><path d="M9 22v-3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><rect x="4" y="2" width="16" height="20" rx="2"/></svg>
                    <h2 t="account.company-info">Company Info</h2>
                </div>
                <div style="display: grid; gap: var(--space-1)">
                    <div class="company-identifiers">
                        <label class="field">
                            <span t="label.enterprise-number">Enterprise Number</span>
                            <input type="text" value.bind="company.identifier" disabled />
                        </label>
                        <label class="field">
                            <span t="label.vat-number">VAT Number</span>
                            <input type="text" value.bind="company.vatNumber" disabled />
                        </label>
                    </div>
                    <label class="field">
                        <span t="account.company-legal-name">Company legal name</span>
                        <input type="text" value.bind="company.name" disabled />
                    </label>
                    <label if.bind="ownershipService.admin" class="field full">
                        <span t="account.download-contract">Download Contract</span>
                        <button type="button" class="btn" style="width: fit-content" click.trigger="downloadContract()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-down-icon lucide-file-down"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
                            <span t="account.download-contract">Download Contract</span>
                        </button>
                    </label>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M17 14V7h-7M7 10v7h7"/></svg>
                    <h2 t="account.peppol-settings">Peppol Settings</h2>
                </div>
                <div style="display: grid; gap: var(--space-1)">
                    <div class="company-identifiers">
                        <label class="field">
                            <span t="label.peppolId">Peppol ID</span>
                            <input type="text" value.to-view="company.peppolId" readonly />
                        </label>
                        <div class="field">
                            <span t="account.access-point">Access Point</span>
                            <div class="access-point-value">
                                <input type="text" value.to-view="accessPointName" title.bind="peppolRegistration && (!peppolRegistration.peppolActive || peppolRegistration.accessPoint === 'NONE') ? i18n.tr('account.access-point-none-description') : ''" aria-label.bind="i18n.tr('account.access-point')" readonly />
                                <a if.bind="accessPointUrl" class="access-point-link" href.bind="accessPointUrl" aria-label.bind="accessPointName" title.bind="accessPointUrl" target="_blank" rel="noopener noreferrer">
                                    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
                                </a>
                            </div>
                        </div>
                    </div>
                    <label if.bind="!accessPointLoading" class="field checkbox">
                        <input type="checkbox" checked.to-view="sendingAllowed" change.trigger="changeSending($event)" disabled.bind="!canEditPeppolSettings || accountSaving" />
                        <span t.bind="isScrada ? 'account.send-and-receive-peppol-documents' : 'account.allow-sending'">Send Peppol documents</span>
                    </label>
                    <template if.bind="supportsPeppolSettings">
                        <span if.bind="peppolSettingsLoading" t="account.peppol-settings-loading">Loading Peppol settings…</span>
                        <div if.bind="peppolSettingsFailed" role="alert">
                            <span t="account.peppol-settings-unavailable">Peppol settings are unavailable.</span>
                            <button type="button" class="btn" click.trigger="refreshReceivingSettings()" disabled.bind="accountSaving || peppolSettingsLoading" t="account.peppol-settings-retry">Retry</button>
                        </div>
                        <div>
                            <label class="field checkbox">
                                <input type="checkbox" checked.to-view="sendingAllowed && !receivingBlocked && peppolSettings.receiveDocuments" change.trigger="changeReceiving($event)" disabled.bind="!canChangeReceiving" aria-describedby.bind="receivingBlocked ? 'peppol-receiving-provider' : 'peppol-received-document-types'" />
                                <span t="account.receive-peppol-documents">Receive Peppol documents</span>
                            </label>
                            <div if.bind="receivingBlocked" id="peppol-receiving-provider" class="peppol-receiving-provider" role="status">
                                <p t="account.receiving-provider" t-params.bind="{ provider: peppolSettings.receivingSmpUrl }">This company already receives Peppol documents through another provider.</p>
                                <button type="button" class="btn" click.trigger="refreshReceivingSettings()" disabled.bind="accountSaving || peppolSettingsLoading || accessPointLoading" t="account.receiving-refresh">Refresh</button>
                            </div>
                            <ul if.bind="!receivingBlocked" id="peppol-received-document-types" class="peppol-document-types">
                                <li t="account.received-document-types.invoices">Invoices</li>
                                <li t="account.received-document-types.credit-notes">Credit notes</li>
                                <li t="account.received-document-types.self-billed-invoices">Self-billing invoices</li>
                                <li t="account.received-document-types.self-billed-credit-notes">Self-billing credit notes</li>
                            </ul>
                        </div>
                    </template>
                    <template if.bind="warningKey">
                        <div class="alert alert--warning warning-box" t.bind="warningKey" t-params.bind="{ provider: alreadyRegisteredProvider }"></div>
                    </template>
                </div>
            </div>
            <div class="card" style="min-width: 320px">
                <div class="card-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin-house-icon lucide-map-pin-house"><path d="M15 22a1 1 0 0 1-1-1v-4a1 1 0 0 1 .445-.832l3-2a1 1 0 0 1 1.11 0l3 2A1 1 0 0 1 22 17v4a1 1 0 0 1-1 1z"/><path d="M18 10a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 .601.2"/><path d="M18 22v-3"/><circle cx="10" cy="10" r="3"/></svg>
                    <h2 t="account.address">Address</h2>
                </div>
                <fieldset class="readonly-fieldset" disabled.bind="!ownershipService.granted.COMPANY_SETTINGS">
                <div class="grid grid-col-73">
                    <label class="field full">
                        <span t="account.company-display-name">Company display name</span>
                        <input type="text" value.bind="company.displayName" />
                    </label>
                    <label class="field">
                        <span t="label.city">City</span>
                        <input type="text" value.bind="company.registeredOffice.city" />
                    </label>
                    <label class="field">
                        <span t="label.postal-code">Postal Code</span>
                        <input type="text" value.bind="company.registeredOffice.postalCode" />
                    </label>
                    <label class="field full">
                        <span t="label.street">Street</span>
                        <input type="text" value.bind="company.registeredOffice.street" />
                    </label>
                </div>
                </fieldset>
            </div>

            <div class="card">
                <div class="card-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-banknote-arrow-down-icon lucide-banknote-arrow-down"><path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="m16 19 3 3 3-3"/><path d="M18 12h.01"/><path d="M19 16v6"/><path d="M6 12h.01"/><circle cx="12" cy="12" r="2"/></svg>
                    <h2 t="account.payment-info">Payment Info</h2>
                </div>
                <fieldset class="readonly-fieldset" disabled.bind="!ownershipService.granted.COMPANY_SETTINGS">
                <div class="grid">
                    <label class="field full">
                        <span t="label.iban">IBAN</span>
                        <input type="text" value.bind="company.iban" />
                    </label>
                    <label class="field full">
                        <span t="label.bic">BIC</span>
                        <input type="text" value.bind="company.bic" />
                    </label>
                    <label class="field full">
                        <span t="label.account-name">Account Name</span>
                        <input type="text" value.bind="company.paymentAccountName" />
                    </label>
                    <div class="field full">
                        <span t="label.payment-terms">Payment Terms</span>
                        <payment-terms-field value.two-way="company.paymentTerms"></payment-terms-field>
                    </div>
                </div>
                </fieldset>
            </div>

            <div class="card" if.bind="company.vatNumber">
                <div class="card-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-badge-percent-icon lucide-badge-percent"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m15 9-6 6"/><path d="M9 9h.01"/><path d="M15 15h.01"/></svg>
                    <h2 t="account.vat-ruleset.title">VAT Settings</h2>
                </div>
                <div style="display: grid; gap: var(--space-1)">
                    <fieldset class="readonly-fieldset" disabled.bind="!ownershipService.granted.COMPANY_SETTINGS">
                    <div class="display-toggle">
                        <span class="vat-toggle-label" class.bind="!isVatExempt ? 'active' : ''" click.trigger="setVatRuleset(false)" t="account.vat-ruleset.options.VAT_REGISTERED">Subject to VAT</span>
                        <label class="switch" aria-label="Toggle VAT mode">
                            <input type="checkbox" checked.to-view="isVatExempt" change.trigger="setVatRuleset($event.target.checked)" />
                            <span class="slider"></span>
                        </label>
                        <span class="vat-toggle-label" class.bind="isVatExempt ? 'active' : ''" click.trigger="setVatRuleset(true)" t="account.vat-ruleset.options.VAT_EXEMPT_ART_56BIS">VAT exempt by Art. 56bis - Small enterprises &lt; € 25.000</span>
                    </div>
                    </fieldset>
                </div>
            </div>

            <div class="card" new-feature="account-notifications">
                <div class="card-header">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bell-ring-icon lucide-bell-ring"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M22 8c0-2.3-.8-4.3-2-6"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/><path d="M4 2C2.8 3.7 2 5.7 2 8"/></svg>
                    <h2 t="account.notifications">Notifications</h2>
                </div>
                <fieldset class="readonly-fieldset" disabled.bind="!ownershipService.granted.COMPANY_SETTINGS">
                <div style="display: grid; gap: var(--space-1)">
                    <label class="field checkbox">
                        <input type="checkbox" checked.bind="company.enableEmailNotification" disabled.bind="!ownershipService.admin" />
                        <span t="account.enable-email-notification">Enable email notifications</span>
                    </label>
                    <label class="field checkbox">
                        <input type="checkbox" checked.bind="company.addAttachmentToNotification" />
                        <span t="account.add-attachment-to-notification">Add attachment to notification</span>
                    </label>
                    <label class="field full">
                        <span t="account.email-notification-cc-list-incoming">Incoming documents: email CC list</span>
                        <textarea value.bind="company.emailNotificationCcListIncoming" change.trigger="validateEmailNotificationCcList('incoming')"></textarea>
                    </label>
                    <label class="field full" new-feature="account-notifications-outgoing">
                        <span t="account.email-notification-cc-list-outgoing">Outgoing documents: email CC list</span>
                        <textarea value.bind="company.emailNotificationCcListOutgoing" change.trigger="validateEmailNotificationCcList('outgoing')"></textarea>
                    </label>
                </div>
                </fieldset>
            </div>

        </div>
    </section>
</application-view>
