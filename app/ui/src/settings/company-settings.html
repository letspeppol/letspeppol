<import from="../components/view/application-view"></import>
<import from="../components/confirmation/confirmation-modal"></import>
<import from="./settings-tabs"></import>

<confirmation-modal></confirmation-modal>

<application-view>
    <settings-tabs active="company"></settings-tabs>
    <div class="section-header">
        <h1 t="settings.company.title">Company</h1>
        <div class="actions">
            <button type="button" class="btn" load="route.bind: addCompanyPath; context.bind: null" title="Add company" t="[title]ownershipAdd.tooltip">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span t="ownershipAdd.action">Add company</span>
            </button>
        </div>
    </div>

    <div class="settings-sheets">
        <section class="card settings-sheet" aria-labelledby="settings-company-heading">
            <div class="settings-sheet-header">
                <h2 id="settings-company-heading" t="account.company-info">Company details</h2>
                <button if.bind="ownershipService.admin" type="button" class="btn" click.trigger="downloadContract()">
                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>
                    <span t="account.download-contract">Download contract</span>
                </button>
            </div>
            <div class="grid">
                <label class="field">
                    <span t="label.enterprise-number">Enterprise number</span>
                    <input type="text" class="num" value.bind="company.identifier" disabled />
                </label>
                <label class="field">
                    <span t="label.vat-number">VAT number</span>
                    <input type="text" class="num" value.bind="company.vatNumber" disabled />
                </label>
                <label class="field settings-span-2">
                    <span t="account.company-legal-name">Company legal name</span>
                    <input type="text" value.bind="company.name" disabled />
                </label>
            </div>
        </section>

        <section class="card settings-sheet" aria-labelledby="settings-peppol-heading">
            <div class="settings-sheet-header">
                <h2 id="settings-peppol-heading" t="account.peppol-settings">Peppol</h2>
            </div>
            <div class="grid">
                <label class="field">
                    <span t="label.peppolId">Peppol ID</span>
                    <input type="text" class="num" value.to-view="company.peppolId" readonly />
                </label>
                <div class="field">
                    <span t="account.access-point">Access point</span>
                    <div class="access-point-value">
                        <input type="text" value.to-view="accessPointName" title.bind="peppolRegistration && (!peppolRegistration.peppolActive || peppolRegistration.accessPoint === 'NONE') ? i18n.tr('account.access-point-none-description') : ''" aria-label.bind="i18n.tr('account.access-point')" readonly />
                        <a if.bind="accessPointUrl" class="access-point-link" href.bind="accessPointUrl" aria-label.bind="accessPointName" title.bind="accessPointUrl" target="_blank" rel="noopener noreferrer">
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
                        </a>
                    </div>
                </div>
            </div>
            <div class="settings-peppol-options">
                <label if.bind="!accessPointLoading" class="field checkbox">
                    <input type="checkbox" checked.to-view="sendingAllowed" change.trigger="changeSending($event)" disabled.bind="!canEditPeppolSettings || accountSaving" />
                    <span t.bind="isScrada ? 'account.send-and-receive-peppol-documents' : 'account.allow-sending'">Send Peppol documents</span>
                </label>
                <template if.bind="supportsPeppolSettings">
                    <p if.bind="peppolSettingsLoading" class="muted settings-note" t="account.peppol-settings-loading">Loading Peppol settings…</p>
                    <div if.bind="peppolSettingsFailed" class="settings-inline-alert" role="alert">
                        <span t="account.peppol-settings-unavailable">Peppol settings are unavailable.</span>
                        <button type="button" class="btn" click.trigger="refreshReceivingSettings()" disabled.bind="accountSaving || peppolSettingsLoading" t="account.peppol-settings-retry">Try again</button>
                    </div>
                    <div>
                        <label class="field checkbox">
                            <input type="checkbox" checked.to-view="sendingAllowed && !receivingBlocked && peppolSettings.receiveDocuments" change.trigger="changeReceiving($event)" disabled.bind="!canChangeReceiving" aria-describedby.bind="receivingBlocked ? 'peppol-receiving-provider' : 'peppol-received-document-types'" />
                            <span t="account.receive-peppol-documents">Receive Peppol documents</span>
                        </label>
                        <div if.bind="receivingBlocked" id="peppol-receiving-provider" class="peppol-receiving-provider" role="status">
                            <p t="account.receiving-provider" t-params.bind="{ provider: peppolSettings.receivingSmpUrl }">This company already receives Peppol documents through another provider.</p>
                            <button type="button" class="btn" click.trigger="refreshReceivingSettings()" disabled.bind="accountSaving || peppolSettingsLoading || accessPointLoading" t="account.receiving-refresh">Check again</button>
                        </div>
                        <ul if.bind="!receivingBlocked" id="peppol-received-document-types" class="peppol-document-types">
                            <li t="account.received-document-types.invoices">Invoices</li>
                            <li t="account.received-document-types.credit-notes">Credit notes</li>
                            <li t="account.received-document-types.self-billed-invoices">Self-billing invoices</li>
                            <li t="account.received-document-types.self-billed-credit-notes">Self-billing credit notes</li>
                        </ul>
                    </div>
                </template>
                <div if.bind="warningKey" class="settings-notice" role="alert">
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                    <p t.bind="warningKey" t-params.bind="{ provider: alreadyRegisteredProvider }"></p>
                </div>
            </div>
        </section>

        <section class="card settings-sheet" aria-labelledby="settings-address-heading">
            <div class="settings-sheet-header">
                <h2 id="settings-address-heading" t="account.address">Address</h2>
            </div>
            <fieldset class="readonly-fieldset" disabled.bind="!ownershipService.granted.COMPANY_SETTINGS">
                <div class="grid">
                    <label class="field settings-span-2">
                        <span t="account.company-display-name">Company display name</span>
                        <input type="text" value.bind="company.displayName" />
                    </label>
                    <label class="field settings-span-2 settings-row-start">
                        <span t="label.street">Street</span>
                        <input type="text" autocomplete="address-line1" value.bind="company.registeredOffice.street" />
                    </label>
                    <label class="field">
                        <span t="label.postal-code">Postal code</span>
                        <input type="text" class="num" autocomplete="postal-code" value.bind="company.registeredOffice.postalCode" />
                    </label>
                    <label class="field">
                        <span t="label.city">City</span>
                        <input type="text" autocomplete="address-level2" value.bind="company.registeredOffice.city" />
                    </label>
                </div>
            </fieldset>
        </section>

        <section class="card settings-sheet" aria-labelledby="settings-payment-heading">
            <div class="settings-sheet-header">
                <h2 id="settings-payment-heading" t="account.payment-info">Payment details</h2>
            </div>
            <fieldset class="readonly-fieldset" disabled.bind="!ownershipService.granted.COMPANY_SETTINGS">
                <div class="grid">
                    <label class="field settings-span-2">
                        <span t="label.iban">IBAN</span>
                        <input type="text" class="num" value.bind="company.iban" />
                    </label>
                    <label class="field">
                        <span t="label.bic">BIC</span>
                        <input type="text" class="num" value.bind="company.bic" />
                    </label>
                    <label class="field settings-span-2">
                        <span t="label.account-name">Account name</span>
                        <input type="text" value.bind="company.paymentAccountName" />
                    </label>
                    <div class="field settings-span-2">
                        <span t="label.payment-terms">Payment terms</span>
                        <payment-terms-field value.two-way="company.paymentTerms"></payment-terms-field>
                    </div>
                </div>
            </fieldset>
        </section>

        <section if.bind="company.vatNumber" class="card settings-sheet" aria-labelledby="settings-vat-heading">
            <div class="settings-sheet-header">
                <h2 id="settings-vat-heading" t="account.vat-ruleset.title">VAT</h2>
            </div>
            <fieldset class="readonly-fieldset" disabled.bind="!ownershipService.granted.COMPANY_SETTINGS">
                <div class="display-toggle settings-vat-toggle">
                    <span class="vat-toggle-label" class.bind="!isVatExempt ? 'active' : ''" click.trigger="setVatRuleset(false)" t="account.vat-ruleset.options.VAT_REGISTERED">Subject to VAT</span>
                    <label class="switch">
                        <input type="checkbox" checked.to-view="isVatExempt" change.trigger="setVatRuleset($event.target.checked)" t="[aria-label]account.vat-ruleset.options.VAT_EXEMPT_ART_56BIS" />
                        <span class="slider"></span>
                    </label>
                    <span class="vat-toggle-label" class.bind="isVatExempt ? 'active' : ''" click.trigger="setVatRuleset(true)" t="account.vat-ruleset.options.VAT_EXEMPT_ART_56BIS">VAT exempt by Art. 56bis - Small enterprises &lt; € 25.000</span>
                </div>
            </fieldset>
        </section>

        <section class="card settings-sheet" new-feature="account-notifications" aria-labelledby="settings-notifications-heading">
            <div class="settings-sheet-header">
                <h2 id="settings-notifications-heading" t="account.notifications">Notifications</h2>
            </div>
            <fieldset class="readonly-fieldset" disabled.bind="!ownershipService.granted.COMPANY_SETTINGS">
                <div class="settings-checks">
                    <label class="field checkbox">
                        <input type="checkbox" checked.bind="company.enableEmailNotification" disabled.bind="!ownershipService.admin" />
                        <span t="account.enable-email-notification">Enable email notifications</span>
                    </label>
                    <label class="field checkbox">
                        <input type="checkbox" checked.bind="company.addAttachmentToNotification" />
                        <span t="account.add-attachment-to-notification">Add attachment to notification</span>
                    </label>
                </div>
                <div class="grid">
                    <label class="field settings-span-2">
                        <span t="account.email-notification-cc-list-incoming">Incoming documents: email CC list</span>
                        <textarea value.bind="company.emailNotificationCcListIncoming" change.trigger="validateEmailNotificationCcList('incoming')"></textarea>
                    </label>
                    <label class="field settings-span-2" new-feature="account-notifications-outgoing">
                        <span t="account.email-notification-cc-list-outgoing">Outgoing documents: email CC list</span>
                        <textarea value.bind="company.emailNotificationCcListOutgoing" change.trigger="validateEmailNotificationCcList('outgoing')"></textarea>
                    </label>
                </div>
            </fieldset>
        </section>
    </div>

    <div if.bind="ownershipService.granted.COMPANY_SETTINGS" class="action-bar settings-action-bar">
        <button type="button" class="btn" click.trigger="cancelChanges()" disabled.bind="accountSaving" t="account.cancel">Discard changes</button>
        <button type="button" class="btn primary" click.trigger="saveAccount()" disabled.bind="accountSaving" t="account.save">Save changes</button>
    </div>
</application-view>
