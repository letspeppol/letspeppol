<div class="modal" role="dialog" aria-modal="true" aria-labelledby="product-category-title" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card product-category-card" keydown.trigger="onKeyDown($event)">
        <header class="modal-header">
            <h2 id="product-category-title" t.bind="productCategoryToUpdate ? 'product.categoryModal.edit-title' : 'product.categoryModal.new-title'">New category</h2>
            <button type="button" class="icon-btn" aria-label="Close dialog" title="Close" t="[aria-label,title]common.close" click.trigger="closeModal()">×</button>
        </header>
        <div class="modal-body">
            <div class="product-category-fields">
                <label class="field">
                    <span t="product.categoryModal.name">Name</span>
                    <input type="text" value.bind="category.name" required />
                </label>
                <label class="field product-category-color">
                    <span t="product.categoryModal.color">Colour</span>
                    <input type="color" value.bind="category.color" />
                </label>
            </div>
        </div>
        <footer class="modal-footer">
            <button if.bind="productCategoryToUpdate" type="button" class="btn danger product-category-delete" click.trigger="deleteProductCategory()" t="product.categoryModal.delete">Delete category</button>
            <button type="button" class="btn" click.trigger="closeModal()" t="common.cancel">Cancel</button>
            <button type="button" class="btn primary" click.trigger="saveProductCategory()" disabled.bind="!category.name || !category.name.trim()" t="product.categoryModal.save">Save category</button>
        </footer>
    </div>
</div>
