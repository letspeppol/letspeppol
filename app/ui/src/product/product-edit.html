<div class="section-header">
    <h1 t.bind="productContext.selectedProduct?.id ? 'product.edit.edit' : 'product.edit.new'">New product</h1>
</div>

<fieldset class="readonly-fieldset product-sheets" disabled.bind="!ownershipService.granted.PRODUCT_MANAGE">
    <section class="card product-sheet" aria-labelledby="product-info-heading">
        <h2 id="product-info-heading" t="product.edit.info">Product</h2>
        <div class="grid">
            <label class="field required product-span-2">
                <span t="label.name">Name</span>
                <input type="text" value.bind="productContext.selectedProduct.name" />
            </label>
            <label class="field product-span-3">
                <span t="label.description">Description</span>
                <input type="text" value.bind="productContext.selectedProduct.description" />
            </label>
            <label class="field">
                <span t="label.reference">Reference</span>
                <input type="text" class="num" value.bind="productContext.selectedProduct.reference" />
            </label>
            <label class="field">
                <span t="label.barcode">Barcode</span>
                <input type="text" class="num" inputmode="numeric" value.bind="productContext.selectedProduct.barcode" />
            </label>
            <label class="field">
                <span t="label.product-category">Category</span>
                <select if.bind="productContext.selectedProduct" value.bind="productContext.selectedProduct.categoryId" matcher.bind="categoryIdMatcher">
                    <option value="" t="product.edit.none">None</option>
                    <option repeat.for="category of productContext.productCategories" value.bind="category.id">${category.name}</option>
                </select>
            </label>
        </div>
    </section>

    <section class="card product-sheet" aria-labelledby="product-pricing-heading">
        <h2 id="product-pricing-heading" t="product.edit.pricing">Price and stock</h2>
        <div class="grid">
            <label class="field">
                <span t="label.sale-price">Sale price</span>
                <input type="number" class="num" inputmode="decimal" step="0.01" value.bind="productContext.selectedProduct.salePrice" />
            </label>
            <label class="field">
                <span t="label.tax-percentage">VAT rate</span>
                <select if.bind="productContext.selectedProduct" value.bind="productContext.selectedProduct.taxPercentage">
                    <option repeat.for="taxPercentage of taxPercentages" model.bind="taxPercentage">${taxPercentage}%</option>
                </select>
            </label>
            <label class="field">
                <span t="label.cost-price">Cost price</span>
                <input type="number" class="num" inputmode="decimal" step="0.01" value.bind="productContext.selectedProduct.costPrice" />
            </label>
            <label class="field">
                <span t="label.stock-quantity">Stock quantity</span>
                <input type="number" class="num" inputmode="numeric" value.bind="productContext.selectedProduct.stockQuantity" />
            </label>
        </div>
    </section>
</fieldset>

<div class="action-bar product-action-bar">
    <button type="button" class="btn" click.trigger="productContext.clearSelectedProduct()" t.bind="ownershipService.granted.PRODUCT_MANAGE ? 'product.edit.cancel' : 'product.edit.back'">Cancel</button>
    <button if.bind="ownershipService.granted.PRODUCT_MANAGE" type="button" class="btn primary" click.trigger="saveProduct()" disabled.bind="!productContext.selectedProduct.name" t="product.edit.save">Save product</button>
</div>
