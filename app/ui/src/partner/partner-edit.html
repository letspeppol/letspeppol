<import from="../components/search/company-search"></import>

<div class="section-header">
    <h1 t.bind="partnerContext.selectedPartner?.id ? 'partner.edit.edit' : 'partner.edit.new'">New partner</h1>
</div>

<fieldset class="readonly-fieldset partner-sheets" disabled.bind="!ownershipService.granted.PARTNER_MANAGE">
    <section class="card partner-sheet" aria-labelledby="partner-company-heading">
        <h2 id="partner-company-heading" t="partner.edit.company-info">Company</h2>
        <div class="grid">
            <div class="partner-span-2">
                <company-search select-company-function.bind="(company) => completePartnerInfo(company)"
                                search-query.two-way="partnerContext.selectedPartner.name">
                </company-search>
            </div>
            <label class="field">
                <span t="label.enterprise-number">Enterprise number</span>
                <input type="text" class="num" value.bind="partnerContext.selectedPartner.identifier" change.trigger="enterpriseNumberChanged()"/>
            </label>
            <label class="field">
                <span t="label.vat-number">VAT number</span>
                <input type="text" class="num" value.bind="partnerContext.selectedPartner.vatNumber" change.trigger="vatNumberChanged()"/>
            </label>
            <label class="field partner-row-start partner-span-2">
                <span t="label.email">Email</span>
                <input type="email" inputmode="email" autocomplete="off" value.bind="partnerContext.selectedPartner.email" />
            </label>
            <fieldset class="partner-roles partner-span-2">
                <legend t="partner.edit.roles">This partner is a</legend>
                <label class="field checkbox">
                    <input type="checkbox" checked.bind="partnerContext.selectedPartner.customer" />
                    <span t="partner.edit.customer">Customer</span>
                </label>
                <label class="field checkbox">
                    <input type="checkbox" checked.bind="partnerContext.selectedPartner.supplier" />
                    <span t="partner.edit.supplier">Supplier</span>
                </label>
            </fieldset>
        </div>
    </section>

    <section class="card partner-sheet" aria-labelledby="partner-peppol-heading">
        <h2 id="partner-peppol-heading" t="partner.edit.peppol">Peppol</h2>
        <div class="grid">
            <label class="field required partner-span-2">
                <span t="label.peppolId">Peppol ID</span>
                <input type="text" class="num" value.bind="partnerContext.selectedPartner.peppolId" change.trigger="peppolIdChanged()" aria-describedby="partner-peppol-hint"/>
                <small id="partner-peppol-hint" class="muted" t="partner.edit.peppol-hint">For Belgian companies this is 0208: followed by the enterprise number.</small>
            </label>
        </div>
    </section>

    <section class="card partner-sheet" aria-labelledby="partner-address-heading">
        <h2 id="partner-address-heading" t="partner.edit.address">Address</h2>
        <div class="grid">
            <label class="field partner-span-2">
                <span t="label.street">Street</span>
                <input type="text" autocomplete="off" value.bind="partnerContext.selectedPartner.registeredOffice.street" />
            </label>
            <label class="field">
                <span t="label.postal-code">Postal code</span>
                <input type="text" class="num" autocomplete="off" value.bind="partnerContext.selectedPartner.registeredOffice.postalCode" />
            </label>
            <label class="field">
                <span t="label.city">City</span>
                <input type="text" autocomplete="off" value.bind="partnerContext.selectedPartner.registeredOffice.city" />
            </label>
            <label class="field">
                <span t="label.country">Country</span>
                <select value.bind="partnerContext.selectedPartner.registeredOffice.countryCode">
                    <option repeat.for="country of Object.entries(countryList)" value.bind="country[0]">${country[1]}</option>
                </select>
            </label>
        </div>
    </section>

    <section class="card partner-sheet" aria-labelledby="partner-payment-heading">
        <h2 id="partner-payment-heading" t="partner.edit.payment-info">Payment details</h2>
        <div class="grid">
            <label class="field partner-span-2">
                <span t="label.iban">IBAN</span>
                <input type="text" class="num" value.bind="partnerContext.selectedPartner.iban" />
            </label>
            <label class="field partner-span-2">
                <span t="label.account-name">Account name</span>
                <input type="text" value.bind="partnerContext.selectedPartner.paymentAccountName" />
            </label>
            <div class="field partner-row-start partner-span-2" if.bind="partnerContext.selectedPartner">
                <span t="label.payment-terms">Payment terms</span>
                <payment-terms-field value.two-way="partnerContext.selectedPartner.paymentTerms"></payment-terms-field>
                <small class="muted" t="paymentTerms.partner-hint">Leave empty to use your own payment terms.</small>
            </div>
        </div>
    </section>
</fieldset>

<div class="action-bar partner-action-bar">
    <button type="button" class="btn" click.trigger="partnerContext.clearSelectedPartner()" t.bind="ownershipService.granted.PARTNER_MANAGE ? 'partner.edit.cancel' : 'partner.edit.back'">Cancel</button>
    <button if.bind="ownershipService.granted.PARTNER_MANAGE" type="button" class="btn primary" click.trigger="savePartner()" disabled.bind="!canSave" t="partner.edit.save">Save partner</button>
</div>
