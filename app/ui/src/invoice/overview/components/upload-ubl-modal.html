<import from="../../edit/components/modals/invoice-modals.css"></import>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="upload-ubl-title" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card" modal-wide.class="!!validationResult">
        <header class="modal-header">
            <h2 id="upload-ubl-title" t="invoice.uploadModal.title">Upload UBL</h2>
            <button type="button" class="icon-btn" click.trigger="closeModal()" aria-label="Close" t="[aria-label,title]common.close">×</button>
        </header>
        <div class="modal-body">
            <template if.bind="!validationResult">
                <button type="button" class="upload-wrapper" dragging.class="isDraggingFile"
                        ref="uploadUblWrapper"
                        click.trigger="openFilePicker()"
                        dragenter.trigger="dragEnter($event)"
                        dragover.trigger="dragOver($event)"
                        dragleave.trigger="dragLeave($event)"
                        drop.trigger="dragDrop($event)">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M12 12v6"/><path d="m15 15-3-3-3 3"/></svg>
                    <span class="upload-title" t="invoice.uploadModal.drop">Choose a UBL file or drop it here</span>
                    <span class="upload-hint" t="invoice.uploadModal.hint">An invoice or a credit note: the document type is read from the file.</span>
                </button>
                <input type="file" class="visually-hidden" ref="fileInput" tabindex="-1" aria-hidden="true" accept=".xml,application/xml,text/xml" change.trigger="onFileSelected()">
            </template>

            <template if.bind="validationResult">
                <p class="modal-lead" t="invoice.validationModal.error-count" t-params.bind="{count: validationResult?.errorCount}"></p>
                <ul class="validation-errors">
                    <li repeat.for="error of validationResult.errors">${error.message}</li>
                </ul>
            </template>
        </div>
        <footer class="modal-footer" if.bind="validationResult">
            <button type="button" class="btn primary" click.trigger="retry()" t="invoice.uploadModal.retry">Choose another file</button>
        </footer>
    </div>
</div>
