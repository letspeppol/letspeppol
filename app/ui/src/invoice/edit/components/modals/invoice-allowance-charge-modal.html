<import from="../../../../app/value-converters/price.ts"></import>
<import from="./invoice-modals.css"></import>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="allowance-modal-title" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card modal-wide">
        <header class="modal-header">
            <h2 id="allowance-modal-title" t="invoice.allowanceChargeModal.title">Discounts/costs</h2>
            <button type="button" class="icon-btn" click.trigger="cancelAllowanceCharge()" aria-label="Close" t="[aria-label,title]common.close">×</button>
        </header>
        <div class="modal-body">
            <div class="modal-form">
                <div class="allowance-toggles">
                    <div class="display-toggle">
                        <span t="invoice.allowanceChargeModal.discount" class="vat-toggle-label" active.class="reason === 'discount'" click.trigger="reason = 'discount'">Discount</span>
                        <label class="switch">
                            <input type="checkbox" checked.to-view="reason === 'cost'" change.trigger="reason = $event.target.checked ? 'cost' : 'discount'" t="[aria-label]invoice.allowanceChargeModal.cost" />
                            <span class="slider"></span>
                        </label>
                        <span t="invoice.allowanceChargeModal.cost" class="vat-toggle-label" active.class="reason === 'cost'" click.trigger="reason = 'cost'">Cost</span>
                    </div>
                    <div class="display-toggle">
                        <span t="invoice.allowanceChargeModal.percentage" class="vat-toggle-label" active.class="mode === 'percentage'" click.trigger="mode = 'percentage'">Percentage</span>
                        <label class="switch">
                            <input type="checkbox" checked.to-view="mode === 'amount'" change.trigger="mode = $event.target.checked ? 'amount' : 'percentage'" t="[aria-label]invoice.allowanceChargeModal.amount" />
                            <span class="slider"></span>
                        </label>
                        <span t="invoice.allowanceChargeModal.amount" class="vat-toggle-label" active.class="mode === 'amount'" click.trigger="mode = 'amount'">Amount</span>
                    </div>
                </div>
                <div class="allowance-inputs">
                    <label class="field">
                        <span t="label.description">Description</span>
                        <input type="text" value.bind="description" />
                    </label>
                    <label class="field">
                        <span t="invoice.allowanceChargeModal.${mode === 'amount' ? 'amount' : 'percentage'}">Amount</span>
                        <input type="number" inputmode="decimal" class="tabular" value.bind="amount" />
                    </label>
                    <label class="field" if.bind="!isUBLBaseLine(parent)">
                        <span t="invoice.edit.tax">VAT</span>
                        <select change.trigger="vatRateChanged($event.target.value)">
                            <option repeat.for="taxRate of vatRateOptions" value.bind="taxRate" selected.bind="taxRate === vatRate">${taxRate}%</option>
                        </select>
                    </label>
                    <button type="button" class="btn" click.trigger="addLine()" disabled.bind="!amount">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                        <span t="invoice.allowanceChargeModal.add">Add</span>
                    </button>
                </div>

                <ul if.bind="allowanceCharge.length" class="allowance-list">
                    <li repeat.for="line of allowanceCharge" class="allowance-row">
                        <span class="allowance-row-reason">
                            <template if.bind="line.AllowanceChargeReason">${line.AllowanceChargeReason}</template>
                            <template else><span t="${line.ChargeIndicator ? 'invoice.allowanceChargeModal.charge' : 'invoice.allowanceChargeModal.discount'}"></span></template>
                        </span>
                        <span class="allowance-row-amount tabular">
                            ${line.ChargeIndicator ? '+' : '−'}
                            <template if.bind="line.MultiplierFactorNumeric">${line.MultiplierFactorNumeric}% (${line.Amount.value | price:line.Amount.__currencyID})</template>
                            <template else>${line.Amount.value | price:line.Amount.__currencyID}</template>
                        </span>
                        <span if.bind="!isUBLBaseLine(parent)" class="allowance-row-vat tabular"><span t="invoice.edit.tax">VAT</span> ${line.TaxCategory.Percent}%</span>
                        <button type="button" class="icon-btn" data-action="remove-line" t="[aria-label,title]common.remove" click.trigger="deleteLine(line)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
        <footer class="modal-footer">
            <button type="button" class="btn danger-outline modal-footer-info" click.trigger="deleteAllowanceCharge()" t="invoice.allowanceChargeModal.remove-all">Remove all</button>
            <button type="button" class="btn" click.trigger="cancelAllowanceCharge()" t="common.cancel">Cancel</button>
            <button type="button" class="btn primary" click.trigger="confirmAllowanceCharge()" t="common.apply">Apply</button>
        </footer>
    </div>
</div>
