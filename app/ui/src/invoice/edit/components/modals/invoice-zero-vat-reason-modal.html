<import from="./invoice-modals.css"></import>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="zero-vat-modal-title" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
        <header class="modal-header">
            <h2 id="zero-vat-modal-title" t="invoice.zero-vat-reason.modal.title">0% VAT reason</h2>
            <button type="button" class="icon-btn" click.trigger="closeModal()" aria-label="Close" t="[aria-label,title]common.close">×</button>
        </header>
        <div class="modal-body">
            <div class="modal-form">
                <label class="field required">
                    <span t="invoice.zero-vat-reason.modal.reason-type">Reason type</span>
                    <select value.to-view="reasonId ?? ''" change.trigger="updateReasonId($event.target.value)" disabled.bind="readOnly">
                        <option value="" t="common.none"></option>
                        <option repeat.for="reason of zeroVatReasonOptions" value.bind="reason" t.bind="getZeroVatReasonLabelKey(reason)"></option>
                    </select>
                </label>
                <label class="field required">
                    <span t="invoice.zero-vat-reason.modal.reason-text">Explanation</span>
                    <input type="text" value.bind="reasonText" t="[placeholder]invoice.zero-vat-reason.modal.reason-text-placeholder" readonly.bind="readOnly" />
                </label>
            </div>
        </div>
        <footer class="modal-footer">
            <button type="button" class="btn" click.trigger="closeModal()" t="common.cancel">Cancel</button>
            <button type="button" class="btn primary" click.trigger="save()" disabled.bind="readOnly || !reasonId || !reasonText?.trim()" t="common.apply">Apply</button>
        </footer>
    </div>
</div>
