<import from="./invoice-modals.css"></import>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="attachment-modal-title" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card modal-wide" keydown.trigger="onKeyDown($event)">
        <header class="modal-header">
            <h2 id="attachment-modal-title" t="invoice.edit.attachments">Attachments</h2>
            <button type="button" class="icon-btn" click.trigger="closeModal()" aria-label="Close" t="[aria-label,title]common.close">×</button>
        </header>
        <div class="modal-body">
            <div class="modal-form">
                <button type="button" class="upload-wrapper" dragging.class="isDraggingFile"
                        ref="uploadWrapper"
                        click.trigger="openFilePicker()"
                        t="[aria-label]invoice.attachmentModal.upload-aria"
                        dragenter.trigger="dragEnter($event)"
                        dragover.trigger="dragOver($event)"
                        dragleave.trigger="dragLeave($event)"
                        drop.trigger="dragDrop($event)">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M12 12v6"/><path d="m15 15-3-3-3 3"/></svg>
                    <span class="upload-title" t="invoice.attachmentModal.upload-file">Add a file</span>
                    <span class="upload-hint" t="invoice.attachmentModal.upload-hint">Drag a file here or choose one. PDF, PNG, JPG, CSV or spreadsheet.</span>
                </button>
                <input type="file" class="visually-hidden" ref="fileInput" tabindex="-1" aria-hidden="true"
                       accept="application/pdf,image/png,image/jpeg,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.oasis.opendocument.spreadsheet"
                       change.trigger="onFileSelected()">
                <div>
                    <label class="field checkbox">
                        <input type="checkbox" checked.bind="includeGeneratedPdf" change.trigger="onToggleGeneratedPdf($event)" />
                        <span t="invoice.attachmentModal.auto-pdf">Include the auto-generated invoice PDF</span>
                    </label>
                    <p class="auto-pdf-help" if.bind="includeGeneratedPdf && hasUploadedPdf" t="invoice.attachmentModal.auto-pdf-replace">An invoice PDF is generated automatically. Turn it off above if your uploaded file replaces it.</p>
                </div>

                <ul if.bind="userAttachments.length" class="attachment-list">
                    <li repeat.for="line of userAttachments" class="attachment-row">
                        <template if.bind="line.Attachment.EmbeddedDocumentBinaryObject">
                            <img class="attachment-row-icon" src.bind="getAttachmentIconSrc(line.Attachment.EmbeddedDocumentBinaryObject)" alt="" width="28" height="28">
                            <span class="attachment-row-name attachment-info-name-with-extension" title.bind="line.Attachment.EmbeddedDocumentBinaryObject.__filename"
                                  data-extension="${getAttachmentFilenameExtension(line.Attachment.EmbeddedDocumentBinaryObject.__filename)}">
                                <span class="attachment-info-name-stem">${getAttachmentFilenameStem(line.Attachment.EmbeddedDocumentBinaryObject.__filename)}</span>
                            </span>
                        </template>
                        <template else>
                            <img class="attachment-row-icon" src="link.png" alt="" width="28" height="28">
                            <input class="attachment-row-name" type="url" value.bind="line.Attachment.ExternalReference.URI" change.trigger="validate()" placeholder="https://" t="[aria-label]invoice.attachmentModal.link"/>
                        </template>
                        <input class="attachment-row-description" type="text" value.bind="line.DocumentDescription" change.trigger="validate()" t="[placeholder,aria-label]label.description"/>
                        <button type="button" class="icon-btn attachment-row-remove" data-action="remove-line" t="[aria-label,title]invoice.attachmentModal.remove" click.trigger="deleteAttachment(line)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </li>
                </ul>
                <button type="button" class="btn add-link" click.trigger="addExternalLink()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    <span t="invoice.attachmentModal.add-link">Add link</span>
                </button>
            </div>
        </div>
        <footer class="modal-footer">
            <button type="button" class="btn" click.trigger="closeModal()" t="common.cancel">Cancel</button>
            <button type="button" class="btn primary" click.trigger="saveAttachments()" disabled.bind="!validated" t="common.apply">Apply</button>
        </footer>
    </div>
</div>
