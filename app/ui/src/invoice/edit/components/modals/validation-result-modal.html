<import from="./invoice-modals.css"></import>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="validation-modal-title" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card modal-wide">
        <header class="modal-header">
            <h2 id="validation-modal-title" t="invoice.validationModal.title">Fix these problems before sending</h2>
            <button type="button" class="icon-btn" click.trigger="closeModal()" aria-label="Close" t="[aria-label,title]common.close">×</button>
        </header>
        <div class="modal-body">
            <p class="modal-lead" t="invoice.validationModal.error-count" t-params.bind="{count: validationResult?.errorCount}"></p>
            <ul class="validation-errors">
                <li repeat.for="error of validationResult.errors">${error.message}</li>
            </ul>
        </div>
        <footer class="modal-footer">
            <button type="button" class="btn primary" click.trigger="closeModal()" t="invoice.validationModal.back-to-invoice">Back to the invoice</button>
        </footer>
    </div>
</div>
