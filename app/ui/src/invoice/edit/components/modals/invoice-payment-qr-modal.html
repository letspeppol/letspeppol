<import from="../../../../components/sepa-qr/sepa-qr"></import>
<import from="./invoice-payment-qr-modal.css"></import>
<import from="./invoice-modals.css"></import>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="payment-qr-title" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card modal-wide">
        <header class="modal-header">
            <h2 id="payment-qr-title" t="invoice.paymentQr.title">Pay this invoice</h2>
            <button class="icon-btn" type="button" click.trigger="closeModal()" aria-label="Close" t="[aria-label,title]common.close">&times;</button>
        </header>
        <div class="modal-body">
            <div class="payment-qr-layout">
                <dl class="payment-qr-details">
                    <div>
                        <dt t="invoice.paymentQr.name">Name</dt>
                        <dd>${name}</dd>
                    </div>
                    <div>
                        <dt t="invoice.paymentQr.iban">IBAN</dt>
                        <dd class="tabular">${iban}</dd>
                    </div>
                    <div if.bind="bic">
                        <dt t="invoice.paymentQr.bic">BIC</dt>
                        <dd class="tabular">${bic}</dd>
                    </div>
                    <div>
                        <dt t="invoice.paymentQr.amount">Amount</dt>
                        <dd class="tabular">${amountLabel}</dd>
                    </div>
                    <div>
                        <dt t="invoice.paymentQr.reference">Reference</dt>
                        <dd class="tabular">${referenceLabel || '/'}</dd>
                    </div>
                </dl>
                <sepa-qr
                    beneficiary-name.bind="name"
                    beneficiary-bic.bind="bic"
                    beneficiary-account-number.bind="iban"
                    amount-euro.bind="amount"
                    creditor-reference.bind="creditorReference"
                    remittance-information.bind="remittanceInformation"
                    size.bind="256">
                </sepa-qr>
            </div>
        </div>
        <footer class="modal-footer">
            <button type="button" class="btn" click.trigger="closeModal()" t="common.close">Close</button>
            <button type="button" class="btn primary" click.trigger="markPaidAndClose()" t="invoice.paymentQr.mark-paid-document.${currentDocumentType}">Mark invoice as paid</button>
        </footer>
    </div>
</div>
