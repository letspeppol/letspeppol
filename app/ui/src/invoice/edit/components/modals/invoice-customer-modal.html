<import from="../customer-search"></import>
<import from="../../../../components/search/company-search"></import>
<import from="./invoice-modals.css"></import>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="customer-modal-title" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card modal-wide" keydown.trigger="onKeyDown($event)">
        <header class="modal-header">
            <h2 id="customer-modal-title" t="invoice.customerModal.title">Customer</h2>
            <button type="button" class="icon-btn" click.trigger="closeModal()" aria-label="Close" t="[aria-label,title]common.close">×</button>
        </header>
        <div class="modal-body">
            <div class="modal-form">
                <section class="modal-form" aria-labelledby="customer-modal-search">
                    <h3 id="customer-modal-search" class="modal-section-title" t="invoice.customerModal.search-title">Select partner</h3>
                    <customer-search component.ref="customerSearch"
                                     select-customer-function.bind="(c) => selectCustomer(c)"
                                     confirm-customer-function.bind="() => customer && saveCustomer()">
                    </customer-search>
                </section>

                <h3 class="modal-section-title" t="invoice.customerModal.create-new">Or enter a new customer</h3>
                <div class="customer-modal-groups">
                    <fieldset class="modal-fieldset">
                        <legend t="partner.edit.company-info">Company</legend>
                        <div class="modal-form two-col">
                            <label class="field">
                                <span t="label.enterprise-number">Enterprise number</span>
                                <input type="text" class="tabular" inputmode="numeric" value.bind="customer.PartyLegalEntity.CompanyID.value" change.trigger="enterpriseNumberChanged()"/>
                            </label>
                            <label class="field">
                                <span t="label.vat-number">VAT number</span>
                                <input type="text" name="customerId" class="tabular" t="[placeholder]placeholder.vat-number" value.bind="customer.PartyTaxScheme.CompanyID.value" required change.trigger="vatNumberChanged()" />
                            </label>
                            <company-search class="full"
                                            select-company-function.bind="(company) => completeCustomerInfo(company)"
                                            search-query.two-way="customer.PartyName.Name"
                                            on-change-function.bind="() => nameChanged()">
                            </company-search>
                            <label class="field required full">
                                <span t="label.peppolId">Peppol ID</span>
                                <input type="text" class="tabular" value.bind="peppolId" change.trigger="peppolIdChanged()"/>
                            </label>
                        </div>
                    </fieldset>

                    <fieldset class="modal-fieldset">
                        <legend t="partner.edit.address">Address</legend>
                        <div class="modal-form two-col">
                            <label class="field full">
                                <span t="label.street">Street</span>
                                <input type="text" name="customerStreet" autocomplete="off" value.bind="customer.PostalAddress.StreetName" required />
                            </label>
                            <label class="field">
                                <span t="label.postal-code">Postal code</span>
                                <input type="text" name="customerPostalCode" class="tabular" autocomplete="off" value.bind="customer.PostalAddress.PostalZone" required />
                            </label>
                            <label class="field">
                                <span t="label.city">City</span>
                                <input type="text" name="customerCity" autocomplete="off" value.bind="customer.PostalAddress.CityName" required />
                            </label>
                            <label class="field full">
                                <span t="label.country">Country</span>
                                <select value.bind="customer.PostalAddress.Country.IdentificationCode">
                                    <option repeat.for="country of Object.entries(countryList)" value.bind="country[0]">${country[1]}</option>
                                </select>
                            </label>
                        </div>
                    </fieldset>
                </div>
            </div>
        </div>
        <footer class="modal-footer">
            <label if.bind="ownershipService.granted.PARTNER_MANAGE" class="field checkbox modal-footer-info">
                <input type="checkbox" checked.bind="saveAsPartner" disabled.bind="!customer.PartyName.Name || !peppolId" />
                <span t="invoice.customerModal.save-as-partner">Save as partner</span>
            </label>
            <button type="button" class="btn" click.trigger="closeModal()" t="common.cancel">Cancel</button>
            <button type="button" class="btn primary" click.trigger="saveCustomer()" t="invoice.customerModal.use-customer"
                    disabled.bind="!customer.PartyName.Name || !customer.PartyLegalEntity.RegistrationName || !customer.PartyTaxScheme.CompanyID || !peppolId || !peppolId.includes(':')">Use this customer</button>
        </footer>
    </div>
</div>
