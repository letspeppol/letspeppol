<label class="search customer-search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <input id="customerSearch"
           type="search"
           name="customerSearch"
           role="combobox"
           aria-autocomplete="list"
           aria-controls="customer-search-results"
           aria-expanded.bind="showSuggestions"
           t="[placeholder,aria-label]invoice.customerModal.search-partner-placeholder"
           value.bind="searchQuery"
           input.trigger="onSearchInput()"
           keydown.trigger="onSearchKeydown($event)"
           blur.trigger="onSearchBlur()"
           autocomplete="off"
    />
    <button if.bind="!showSuggestions" type="button" class="icon-btn" click.trigger="showFirstPartners()" t="[aria-label,title]invoice.customerModal.show-partners">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button else type="button" class="icon-btn" click.trigger="hidePartners()" t="[aria-label,title]invoice.customerModal.hide-partners">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <ul id="customer-search-results" class="autocomplete-list" role="listbox" if.bind="showSuggestions">
        <li repeat.for="c of filteredCustomers"
            role="option"
            class="autocomplete-item"
            active.class="$index === highlightedIndex"
            aria-selected.bind="$index === highlightedIndex"
            click.trigger="selectCustomer(c)"
            mousedown.trigger="$event.preventDefault()">
                <div class="title">${c.name}</div>
                <div class="meta tabular"><span t="label.vat-number">VAT number</span> ${c.vatNumber}</div>
                <div class="addr" if.bind="c.registeredOffice && (c.registeredOffice.street || c.registeredOffice.houseNumber || c.registeredOffice.postalCode || c.registeredOffice.city)">
                    ${c.registeredOffice.street} ${c.registeredOffice.houseNumber}, ${c.registeredOffice.postalCode} ${c.registeredOffice.city}
                </div>
        </li>
        <li class="autocomplete-empty" if.bind="filteredCustomers.length === 0 && searchQuery" t="invoice.customerModal.no-matches">No matches</li>
    </ul>
</label>
