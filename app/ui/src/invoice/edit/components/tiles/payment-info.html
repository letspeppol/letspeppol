<import from="../../../../app/value-converters/date-format"></import>
<import from="../modals/invoice-payment-qr-modal"></import>
<import from="./payment-info.css"></import>

<section class="composer-info" missing-required.class="!isPaymentInfoComplete" aria-labelledby="tile-payment-title">
    <header class="tile-head" click.trigger="showPaymentModal()">
        <h2 class="tile-title" id="tile-payment-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="m16 19 3 3 3-3"/><path d="M18 12h.01"/><path d="M19 16v6"/><path d="M6 12h.01"/><circle cx="12" cy="12" r="2"/></svg>
            <span t="invoice.paymentModal.title">Payment</span>
        </h2>
        <button if.bind="!readOnly" type="button" class="icon-btn tile-edit" aria-labelledby="tile-payment-edit tile-payment-title">
            <span id="tile-payment-edit" class="visually-hidden" t="common.edit">Edit</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
        </button>
    </header>
    <dl class="tile-fields">
        <div>
            <dt t="invoice.edit.method">Method</dt>
            <dd if.bind="paymentMethodName">${paymentMethodName}</dd>
            <dd else t="common.none">None</dd>
        </div>
        <template if.bind="invoiceContext.selectedInvoice.PaymentMeans.PayeeFinancialAccount">
            <div>
                <dt t="label.account-name">Account name</dt>
                <dd>${invoiceContext.selectedInvoice.PaymentMeans.PayeeFinancialAccount.Name ?? '/'}</dd>
            </div>
            <div>
                <dt t="label.iban">IBAN</dt>
                <dd class="tabular">${invoiceContext.selectedInvoice.PaymentMeans.PayeeFinancialAccount.ID ?? '/'}</dd>
            </div>
        </template>
        <div if.bind="invoiceContext.selectedInvoice.PaymentMeans.PaymentID">
            <dt t="label.reference">Reference</dt>
            <dd class="tabular">${paymentReference}</dd>
        </div>
        <div if.bind="isSuccessfullyProcessed && invoiceContext.selectedDocument.paidOn">
            <dt t="invoice.paymentQr.marked-done-on">Marked as paid on</dt>
            <dd class="tabular">${invoiceContext.selectedDocument.paidOn | dateFormat}</dd>
        </div>
    </dl>

    <template if.bind="isSuccessfullyProcessed && ownershipService.granted.INVOICE_STATUS && invoiceContext.selectedDocument">
        <button if.bind="invoiceContext.selectedDocument.paidOn" type="button" class="btn payment-state-action" new-feature="payment-state-action" click.trigger="markPaid($event)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="m17 17 5 5"/><path d="M18 12h.01"/><path d="m22 17-5 5"/><path d="M6 12h.01"/><circle cx="12" cy="12" r="2"/></svg>
            <span t="invoice.paymentQr.mark-unpaid-document.${currentDocumentType}">Mark invoice as unpaid</span>
        </button>
        <button if.bind="!invoiceContext.selectedDocument.paidOn && shouldShowPaymentQrAction" type="button" class="btn payment-state-action" new-feature="payment-state-action" click.trigger="showPaymentQrModal()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
            <span t="invoice.paymentQr.show-and-mark-paid">Pay with QR code</span>
        </button>
        <button if.bind="!invoiceContext.selectedDocument.paidOn && !shouldShowPaymentQrAction" type="button" class="btn payment-state-action" new-feature="payment-state-action" click.trigger="markPaid($event)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5"/><path d="m16 19 3 3 3-3"/><path d="M18 12h.01"/><path d="M19 16v6"/><path d="M6 12h.01"/><circle cx="12" cy="12" r="2"/></svg>
            <span t="invoice.paymentQr.mark-paid-document.${currentDocumentType}">Mark invoice as paid</span>
        </button>
    </template>
</section>

<invoice-payment-qr-modal
    open.bind="paymentQrModalOpen"
    invoice-context.bind="invoiceContext"
    close.bind="() => closePaymentQrModal()"
    mark-paid.bind="() => markPaidAndClose()">
</invoice-payment-qr-modal>
