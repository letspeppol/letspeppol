<section class="composer-info" missing-required.class="!isCustomerInfoComplete" aria-labelledby="tile-customer-title">
    <header class="tile-head" click.trigger="showCustomerModal()">
        <h2 class="tile-title" id="tile-customer-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M12 6h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/><path d="M8 6h.01"/><path d="M9 22v-3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><rect x="4" y="2" width="16" height="20" rx="2"/></svg>
            <span if.bind="invoiceContext.partnerIsSupplier" t="invoice.supplier">Supplier</span>
            <span else t="invoice.customer">Customer</span>
        </h2>
        <button if.bind="!readOnly" type="button" class="icon-btn tile-edit" aria-labelledby="tile-customer-edit tile-customer-title">
            <span id="tile-customer-edit" class="visually-hidden" t="common.edit">Edit</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
        </button>
    </header>
    <dl class="tile-fields">
        <div>
            <dt t="label.name">Name</dt>
            <dd>${party.PartyName.Name}</dd>
        </div>
        <div if.bind="!readOnly || party.PostalAddress?.StreetName || party.PostalAddress?.CityName">
            <dt t="label.address">Address</dt>
            <dd>
                <span class="address-line">${party.PostalAddress.StreetName} ${party.PostalAddress.AdditionalStreetName}</span>
                <span class="address-line">${party.PostalAddress.PostalZone} ${party.PostalAddress.CityName}</span>
            </dd>
        </div>
    </dl>
</section>
