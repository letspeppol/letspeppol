<import from="../../../../app/value-converters/price.ts"></import>

<section class="composer-info" aria-labelledby="tile-discounts-title">
    <header class="tile-head" click.trigger="showAllowanceChargeModal()">
        <h2 class="tile-title" id="tile-discounts-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            <span t="invoice.allowanceChargeModal.title">Discounts/costs</span>
        </h2>
        <button if.bind="!readOnly" type="button" class="icon-btn tile-edit" aria-labelledby="tile-discounts-edit tile-discounts-title">
            <span id="tile-discounts-edit" class="visually-hidden" t="common.edit">Edit</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
        </button>
    </header>
    <ul if.bind="invoiceContext.selectedInvoice.AllowanceCharge.length" class="allowance-charge-list">
        <li repeat.for="line of invoiceContext.selectedInvoice.AllowanceCharge" class="allowance-charge-line">
            <span if.bind="line.AllowanceChargeReason" title.bind="line.AllowanceChargeReason" class="allowance-charge-reason">${line.AllowanceChargeReason}</span>
            <span else class="allowance-charge-reason" t="${line.ChargeIndicator ? 'invoice.allowanceChargeModal.charge' : 'invoice.allowanceChargeModal.discount'}"></span>
            <span class="allowance-charge-amount tabular">
                ${line.ChargeIndicator ? '+' : '−'}
                <template if.bind="line.MultiplierFactorNumeric">${line.MultiplierFactorNumeric}% (${line.Amount.value | price:line.Amount.__currencyID})</template>
                <template else>${line.Amount.value | price:line.Amount.__currencyID}</template>
            </span>
        </li>
    </ul>
</section>
