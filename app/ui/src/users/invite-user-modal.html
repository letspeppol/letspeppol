<div class="modal" role="dialog" aria-modal="true" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card" style="width: min(460px, calc(100% - var(--space-2rem)))" keydown.trigger="onKeyDown($event)">
        <header class="modal-header">
            <h3 t="users.invite.title">Invite user</h3>
            <button type="button" class="icon-btn" aria-label="Close dialog" t="[aria-label]common.close" title="Close" t="[title]common.close" click.trigger="closeModal()">×</button>
        </header>
        <div class="modal-body">
            <form class="auth-form">
                <p class="users-intro" t="users.invite.description">We email a link to join this company. It can be used once.</p>
                <label class="field full required">
                    <span t="label.name">Name</span>
                    <input name="invite-name" type="text" maxlength="255" autocomplete="off" value.bind="name" />
                </label>
                <label class="field full required">
                    <span t="label.email">Email</span>
                    <input name="invite-email" type="email" autocomplete="off" placeholder="you@company.com" t="[placeholder]placeholder.email" value.bind="email" />
                </label>
                <fieldset class="invite-permissions">
                    <legend t="users.invite.permissions">Permissions</legend>
                    <label repeat.for="column of columns" class="field checkbox">
                        <input type="checkbox"
                               checked.to-view="flags[column]"
                               disabled.bind="implied[column] || submitting"
                               change.trigger="togglePermission(column, $event.target.checked)" />
                        <span t="users.permission.${column}"></span>
                    </label>
                </fieldset>
                <p if.bind="errorText" class="form-error">${errorText}</p>
            </form>
        </div>
        <footer class="modal-footer">
            <button type="button" class="btn" title="Cancel" t="[title]common.cancel" click.trigger="closeModal()" t="common.cancel">Cancel</button>
            <button type="button" class="btn primary" disabled.bind="!canInvite" title="Send invitation" t="[title]users.invite.send" click.trigger="invite()" t="users.invite.send">Send invitation</button>
        </footer>
    </div>
</div>
