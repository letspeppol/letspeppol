<div class="modal" role="dialog" aria-modal="true" aria-labelledby="invite-user-title" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card invite-card" keydown.trigger="onKeyDown($event)">
        <header class="modal-header">
            <h2 id="invite-user-title" t="users.invite.title">Invite user</h2>
            <button type="button" class="icon-btn" aria-label="Close dialog" title="Close" t="[aria-label,title]common.close" click.trigger="closeModal()">×</button>
        </header>
        <div class="modal-body">
            <form class="invite-form">
                <p class="users-intro" t="users.invite.description">We email a link to join this company. It can be used once.</p>
                <label class="field required">
                    <span t="label.name">Name</span>
                    <input name="invite-name" type="text" maxlength="255" autocomplete="off" value.bind="name" />
                </label>
                <label class="field required">
                    <span t="label.email">Email</span>
                    <input name="invite-email" type="email" inputmode="email" autocomplete="off" placeholder="you@company.com" t="[placeholder]placeholder.email" value.bind="email" />
                </label>
                <fieldset class="invite-permissions">
                    <legend t="users.invite.permissions">Permissions</legend>
                    <label repeat.for="column of columns" class="field checkbox" title.bind="implied[column] ? impliedHint : ''">
                        <input type="checkbox"
                               checked.to-view="flags[column]"
                               disabled.bind="implied[column] || submitting"
                               change.trigger="togglePermission(column, $event.target.checked)" />
                        <span t="users.permission.${column}"></span>
                    </label>
                </fieldset>
                <p if.bind="errorText" class="form-error" role="alert">${errorText}</p>
            </form>
        </div>
        <footer class="modal-footer">
            <button type="button" class="btn" click.trigger="closeModal()" t="common.cancel">Cancel</button>
            <button type="button" class="btn primary" disabled.bind="!canInvite" click.trigger="invite()" t="users.invite.send">Send invitation</button>
        </footer>
    </div>
</div>
