<import from="../components/view/application-view"></import>
<import from="../app/value-converters/date-format.ts"></import>
<import from="../app/value-converters/price.ts"></import>

<application-view>
    <div class="section-header sponsors-header">
        <div>
            <h1 id="sponsors-title" t="sponsors-page.title">Sponsors</h1>
            <p t="sponsors-page.subtitle">Companies and people helping keep Let’s Peppol running.</p>
        </div>
    </div>

    <div class="card table-card">
        <div class="table-wrapper">
            <table class="data-table stack-on-phone sponsors-table" aria-describedby="sponsors-title">
                <thead>
                <tr>
                    <th class="sponsors-date-col" t="sponsors-page.table.date">Date</th>
                    <th class="sponsors-name-col" t="sponsors-page.table.name">Name</th>
                    <th t="sponsors-page.table.message">Message</th>
                    <th class="num" t="sponsors-page.table.amount">Amount</th>
                </tr>
                </thead>
                <tbody>
                <tr repeat.for="item of contributions">
                    <td class="tabular sponsors-date" t="[data-label]sponsors-page.table.date">${item.date | dateFormat}</td>
                    <td class="sponsors-name" data-primary>${item.name}</td>
                    <td class="sponsor-message" t="[data-label]sponsors-page.table.message">${item.message}</td>
                    <td class="num sponsors-amount" t="[data-label]sponsors-page.table.amount">${item.amount | price:item.currency}</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div if.bind="isLoading" class="empty-state">
            <p t="sponsors-page.loading">Loading sponsors…</p>
        </div>
        <div if.bind="!isLoading && loadError" class="empty-state">
            <p t="sponsors-page.load-error">The sponsors could not be loaded. Reload the page to try again.</p>
        </div>
        <div if.bind="!isLoading && !loadError && contributions.length === 0" class="empty-state">
            <p t="sponsors-page.empty">No sponsors yet.</p>
        </div>
    </div>
</application-view>
