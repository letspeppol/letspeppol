<template>
    <import from="./totp-manager.css"></import>

    <p if.bind="state === 'loading'" class="totp-status" t="totp.loading">Loading…</p>

    <div if.bind="state === 'disabled'" class="totp-block">
        <p class="totp-status" t="totp.disabled">Two-factor authentication is not enabled.</p>
        <div>
            <button type="button" class="btn primary" click.trigger="startSetup()" disabled.bind="busy">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
                <span t="totp.enable">Turn on two-factor authentication</span>
            </button>
        </div>
    </div>

    <div if.bind="state === 'setup'" class="totp-block">
        <p class="totp-text" t="totp.scan-qr">Scan this QR code with your authenticator app.</p>
        <div class="totp-qr">
            <img src.bind="setupData.qrCodeDataUri" t="[alt]totp.qr-alt" alt="QR code for your authenticator app" width="200" height="200">
        </div>
        <details class="totp-manual-entry">
            <summary t="totp.manual-entry">Can’t scan? Enter this key manually</summary>
            <p class="totp-secret num">${setupData.secret}</p>
        </details>
        <div class="totp-verify">
            <label class="field">
                <span t="totp.enter-code">Enter the 6-digit code from your app</span>
                <input type="text" class="totp-code-input num" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code"
                       value.bind="verifyCode" placeholder="000000"
                       keyup.trigger="$event.key === 'Enter' ? verifyAndEnable() : undefined">
            </label>
            <p if.bind="verifyError" class="form-error" role="alert" t="totp.invalid-code">That code is not valid. Enter the current code from your app.</p>
            <div class="totp-actions">
                <button type="button" class="btn" click.trigger="cancelSetup()" t="common.cancel">Cancel</button>
                <button type="button" class="btn primary" click.trigger="verifyAndEnable()" disabled.bind="busy || !verifyCode.trim()">${busy ? verifyingText : verifyEnableText}</button>
            </div>
        </div>
    </div>

    <div if.bind="state === 'recovery-codes'" class="totp-block">
        <p class="totp-recovery-warning" role="note">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            <span t="totp.recovery-warning">Save these recovery codes. You won’t see them again.</span>
        </p>
        <ul class="totp-recovery-grid">
            <li repeat.for="code of recoveryCodes" class="totp-recovery-code num">${code}</li>
        </ul>
        <div class="totp-actions">
            <button type="button" class="btn" click.trigger="copyRecoveryCodes()">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                <span t="totp.copy">Copy codes</span>
            </button>
            <button type="button" class="btn" click.trigger="downloadRecoveryCodes()">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                <span t="totp.download">Download codes</span>
            </button>
            <button type="button" class="btn primary" click.trigger="finishSetup()" t="totp.done">I saved my codes</button>
        </div>
    </div>

    <div if.bind="state === 'enabled'" class="totp-block">
        <p class="totp-status totp-status-enabled">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
            <span t="totp.enabled">Two-factor authentication is on.</span>
        </p>
        <div>
            <button type="button" class="btn" click.trigger="startDisable()" t="totp.disable">Turn off two-factor authentication</button>
        </div>
    </div>

    <div if.bind="state === 'disabling'" class="totp-block">
        <p class="totp-text" t.bind="useRecoveryCode ? 'totp.disable-confirm-recovery' : 'totp.disable-confirm'">Enter your current authenticator code to turn off two-factor authentication.</p>
        <div class="totp-verify">
            <label class="field">
                <span t.bind="useRecoveryCode ? 'login.recovery-code' : 'totp.auth-code'">Authentication code</span>
                <input if.bind="!useRecoveryCode"
                       type="text" class="totp-code-input num" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code"
                       value.bind="disableCode" placeholder="000000"
                       keyup.trigger="$event.key === 'Enter' ? confirmDisable() : undefined">
                <input else
                       type="text" class="totp-code-input num" maxlength="8" autocapitalize="characters" spellcheck="false" autocomplete="off"
                       value.bind="disableCode"
                       input.trigger="onRecoveryCodeInput($event)"
                       keyup.trigger="$event.key === 'Enter' ? confirmDisable() : undefined">
            </label>
            <p if.bind="disableError" class="form-error" role="alert" t="totp.invalid-code-short">That code is not valid.</p>
            <button type="button" class="btn ghost totp-switch-method" click.trigger="toggleRecoveryCode($event)" t.bind="useRecoveryCode ? 'login.use-authenticator' : 'login.use-recovery'">Use a recovery code instead</button>
            <div class="totp-actions">
                <button type="button" class="btn" click.trigger="cancelDisable()" t="common.cancel">Cancel</button>
                <button type="button" class="btn danger" click.trigger="confirmDisable()" disabled.bind="busy || !disableCode.trim()">${busy ? disablingText : disableText}</button>
            </div>
        </div>
    </div>
</template>
