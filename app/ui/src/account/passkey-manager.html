<template>
    <import from="./passkey-manager.css"></import>
    <div if.bind="!supported" class="passkey-notice" role="status">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <p t="passkey.not-supported">This browser does not support passkeys. Sign in with your password, or use a browser that supports passkeys.</p>
    </div>

    <div if.bind="supported" class="passkeys">
        <ul class="passkey-list">
            <li repeat.for="passkey of passkeys" class="passkey-row">
                <template if.bind="editingId === passkey.id">
                    <div class="passkey-rename">
                        <input type="text" value.bind="editingName" t="[aria-label]passkey.name-label"
                               keyup.trigger="$event.key === 'Enter' ? saveRename(passkey) : ($event.key === 'Escape' ? cancelRename() : undefined)" />
                        <button type="button" class="btn primary" click.trigger="saveRename(passkey)" t="common.save">Save</button>
                        <button type="button" class="btn" click.trigger="cancelRename()" t="common.cancel">Cancel</button>
                    </div>
                </template>
                <template else>
                    <svg class="passkey-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>
                    <div class="passkey-info">
                        <div class="passkey-name">${passkey.displayName}</div>
                        <div class="passkey-meta">
                            <span><span t="passkey.added">Added</span> <span class="num">${passkey.createdOn | dateTimeFormat}</span></span>
                            <span><span t="passkey.last-used">Last used</span> <span class="num" if.bind="passkey.lastUsedOn">${passkey.lastUsedOn | dateTimeFormat}</span><span else>${neverText}</span></span>
                        </div>
                    </div>
                    <div class="passkey-actions">
                        <button type="button" class="icon-btn" click.trigger="startRename(passkey)" t="[aria-label,title]passkey.rename">
                            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
                        </button>
                        <button type="button" class="icon-btn passkey-delete" click.trigger="confirmDelete(passkey)" t="[aria-label,title]passkey.delete-title">
                            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                </template>
            </li>
        </ul>

        <p if.bind="passkeys.length === 0" class="passkey-empty" t="passkey.empty">Add a passkey to sign in with your fingerprint, face or device PIN.</p>

        <div class="passkey-add">
            <label class="field">
                <span t="passkey.name-label">Passkey name</span>
                <input type="text" value.bind="newPasskeyName" t="[placeholder]passkey.name-placeholder"
                       keyup.trigger="$event.key === 'Enter' ? addPasskey() : undefined" />
            </label>
            <button type="button" class="btn primary" click.trigger="addPasskey()" disabled.bind="adding">
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                <span>${adding ? registeringText : addText}</span>
            </button>
        </div>
    </div>
</template>
