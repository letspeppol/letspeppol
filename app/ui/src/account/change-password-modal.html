<import from="../components/choose-password/choose-password"></import>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="change-password-title" show.bind="open">
    <div class="modal-backdrop"></div>
    <div class="modal-card change-password-card" keydown.trigger="onKeyDown($event)">
        <header class="modal-header">
            <h2 id="change-password-title" t="account.change-password">Change password</h2>
            <button type="button" class="icon-btn" aria-label="Close dialog" title="Close" t="[aria-label,title]common.close" click.trigger="closeModal()">×</button>
        </header>
        <div class="modal-body">
            <form class="auth-form">
                <choose-password component.ref="choosePassword" password.two-way="password" confirm-password.two-way="confirmPassword"></choose-password>
                <p if.bind="error" class="form-error" role="alert" t="account.change-password-failed">Your password was not changed. Try again.</p>
            </form>
        </div>
        <footer class="modal-footer">
            <button type="button" class="btn" click.trigger="closeModal()" t="common.cancel">Cancel</button>
            <button type="button" class="btn primary"
                    disabled.bind="!password || !choosePassword || !choosePassword.rules.matchOk || !choosePassword.rules.pwStrong || isRequesting"
                    click.trigger="changePassword()" t="account.change-password">Change password</button>
        </footer>
    </div>
</div>
